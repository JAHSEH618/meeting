name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 契约校验 ──────────────────────────────────────────────────
  contracts:
    name: Contract Lint & Validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/meeting-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install npm deps
        run: npm ci

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Spectral Lint (public-api)
        run: ./node_modules/.bin/spectral lint openapi/public-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Spectral Lint (internal-callback-api)
        run: ./node_modules/.bin/spectral lint openapi/internal-callback-api.yaml --ruleset .spectral-callback.yaml --fail-severity warn

      - name: Spectral Lint (ai-worker-internal-api)
        run: ./node_modules/.bin/spectral lint openapi/ai-worker-internal-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Validate JSON Schema
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/rabbitmq/processing-task-message.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema is valid Draft 2020-12')
          "

      - name: Consistency Check
        run: npm run check

  # ── Java 后端 ─────────────────────────────────────────────────
  meeting-api:
    name: Meeting API (Java 17)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: ./mvnw verify -q
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins=warn"

      - name: Flyway Migration Dry Run
        run: |
          echo "Flyway migration exists:"
          ls -la meeting-api-infrastructure/src/main/resources/db/migration/

  # ── Python AI Worker ──────────────────────────────────────────
  ai-worker:
    name: AI Worker (Python 3.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --extra dev

      - name: Type Check
        run: uv run pyright ai_worker/

      - name: Unit Tests
        run: uv run pytest tests/ -x -q

      - name: Imports Check
        run: uv run python -c "import ai_worker; print('ai_worker imports OK')"

  # ── 前端 ──────────────────────────────────────────────────────
  meeting-web:
    name: Meeting Web (Node 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

  # ── DDL 语法校验 ──────────────────────────────────────────────
  ddl-check:
    name: DDL Syntax Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: meeting_ci
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run All Migrations
        run: |
          for f in apps/meeting-api/meeting-api-infrastructure/src/main/resources/db/migration/V*.sql; do
            echo "Applying $(basename "$f")..."
            PGPASSWORD=meeting_ci psql -h localhost -U meeting -d meeting_ci -f "$f" -v ON_ERROR_STOP=1
          done

  # ── Secret 扫描 (G1/G2) ───────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can scan all commits in PRs

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── K8s 清单 lint (G3) ────────────────────────────────────────
  k8s-lint:
    name: K8s Manifests Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Lint dev overlay
        run: |
          kustomize build infra/meeting-infra/k8s/overlays/dev \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: Lint prod overlay
        run: |
          kustomize build infra/meeting-infra/k8s/overlays/prod \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

  # ── Playwright E2E (I5) ───────────────────────────────────────
  meeting-web-e2e:
    name: Meeting Web E2E (Playwright)
    runs-on: ubuntu-24.04
    # The full-stack compose pulls multiple service images; do not block
    # PR merges on transient image-pull issues. Re-enable as required:
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/meeting-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/meeting-web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Boot full-stack (postgres + rabbit + minio + meeting-api)
        working-directory: .
        run: |
          docker compose --profile full-stack \
              -f infra/meeting-infra/docker/compose/docker-compose.yml \
              up -d --quiet-pull
          # Give meeting-api up to 3 min to apply Flyway + start the SSE channel.
          for i in $(seq 1 36); do
            if curl -fsSL http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "meeting-api up after ${i} attempts"
              break
            fi
            sleep 5
          done
          curl -fsSL http://localhost:8080/actuator/health || (echo "meeting-api never came up"; exit 1)

      - name: Run vite dev server
        run: |
          npm run dev -- --host 0.0.0.0 &
          for i in $(seq 1 24); do
            if curl -fsSL http://localhost:5173 > /dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run E2E
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE: http://localhost:8080
        run: npm run e2e

      - name: Upload Playwright trace + HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/meeting-web/playwright-report
            apps/meeting-web/test-results
          retention-days: 14
