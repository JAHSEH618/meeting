name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 契约校验 ──────────────────────────────────────────────────
  contracts:
    name: Contract Lint & Validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/meeting-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Spectral Lint (public-api)
        run: spectral lint openapi/public-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Spectral Lint (internal-callback-api)
        run: spectral lint openapi/internal-callback-api.yaml --ruleset .spectral-callback.yaml --fail-severity warn

      - name: Spectral Lint (ai-worker-internal-api)
        run: spectral lint openapi/ai-worker-internal-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Validate JSON Schema
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/rabbitmq/processing-task-message.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema is valid Draft 2020-12')
          "

      - name: Consistency Check
        run: bash scripts/check-consistency.sh

      - name: Install npm deps
        run: npm ci

      - name: Set up Java for codegen
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Codegen Diff Check (TS + Python + Java)
        run: |
          set -euo pipefail

          # Helper: detect both modified and newly-created (untracked) generated files
          check_clean() {
            local path="$1"
            local name="$2"
            git add -N "$path"
            git diff --exit-code "$path" || {
              echo "::error::$name is out of date or contains untracked files. Run 'npm run codegen' and commit the result."
              exit 1
            }
          }

          npm run codegen:ts
          check_clean ../../apps/meeting-web/src/shared/api/types.gen.ts "TS types.gen.ts"

          npm run codegen:py-callback
          check_clean ../../apps/ai-worker/ai_worker/generated/internal_callback_types.py "Python internal_callback_types.py"

          npm run codegen:py-worker-internal
          check_clean ../../apps/ai-worker/ai_worker/generated/ai_worker_internal_types.py "Python ai_worker_internal_types.py"

          npm run codegen:py-task-msg
          check_clean ../../apps/ai-worker/ai_worker/generated/processing_task_message.py "Python processing_task_message.py"

          npm run codegen:java-public
          check_clean ../../apps/meeting-api/meeting-api-client/generated/public-api "Java public-api generated models"

          npm run codegen:java-worker-internal
          check_clean ../../apps/meeting-api/meeting-api-client/generated/ai-worker-internal "Java ai-worker-internal generated models"

  # ── Java 后端 ─────────────────────────────────────────────────
  meeting-api:
    name: Meeting API (Java 17)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: ./mvnw verify -q
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins=warn"

      - name: Flyway Migration Dry Run
        run: |
          echo "Flyway migration exists:"
          ls -la meeting-api-infrastructure/src/main/resources/db/migration/

  # ── Python AI Worker ──────────────────────────────────────────
  ai-worker:
    name: AI Worker (Python 3.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --extra dev

      - name: Type Check
        run: uv run pyright ai_worker/

      - name: Unit Tests
        run: uv run pytest tests/ -x -q

      - name: Imports Check
        run: uv run python -c "import ai_worker; print('ai_worker imports OK')"

  # ── 前端 ──────────────────────────────────────────────────────
  meeting-web:
    name: Meeting Web (Node 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

  # ── DDL 语法校验 ──────────────────────────────────────────────
  ddl-check:
    name: DDL Syntax Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: meeting_ci
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run All Migrations
        run: |
          for f in apps/meeting-api/meeting-api-infrastructure/src/main/resources/db/migration/V*.sql; do
            echo "Applying $(basename "$f")..."
            PGPASSWORD=meeting_ci psql -h localhost -U meeting -d meeting_ci -f "$f" -v ON_ERROR_STOP=1
          done