name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 契约校验 ──────────────────────────────────────────────────
  contracts:
    name: Contract Lint & Validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/meeting-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install npm deps
        run: npm ci

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Spectral Lint (public-api)
        run: ./node_modules/.bin/spectral lint openapi/public-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Spectral Lint (internal-callback-api)
        run: ./node_modules/.bin/spectral lint openapi/internal-callback-api.yaml --ruleset .spectral-callback.yaml --fail-severity warn

      - name: Spectral Lint (ai-worker-internal-api)
        run: ./node_modules/.bin/spectral lint openapi/ai-worker-internal-api.yaml --ruleset .spectral-public.yaml --fail-severity warn

      - name: Validate JSON Schema
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/rabbitmq/processing-task-message.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema is valid Draft 2020-12')
          "

      - name: Consistency Check
        run: npm run check

  # ── Java 后端 ─────────────────────────────────────────────────
  meeting-api:
    name: Meeting API (Java 17)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: ./mvnw verify -q
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins=warn"

      - name: Flyway Migration Dry Run
        run: |
          echo "Flyway migration exists:"
          ls -la meeting-api-infrastructure/src/main/resources/db/migration/

  # ── Python AI Worker ──────────────────────────────────────────
  ai-worker:
    name: AI Worker (Python 3.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --extra dev

      - name: Type Check
        run: uv run pyright ai_worker/

      - name: Unit Tests
        run: uv run pytest tests/ -x -q

      - name: Imports Check
        run: uv run python -c "import ai_worker; print('ai_worker imports OK')"

  # ── 前端 ──────────────────────────────────────────────────────
  meeting-web:
    name: Meeting Web (Node 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/meeting-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

  # ── 工作站 SPA (Phase 9 P6 / E1.8) ───────────────────────────
  ai-worker-web:
    name: AI Worker Web (Node 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-worker-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ai-worker-web/package-lock.json

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright happy-path
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-web-playwright
          path: |
            apps/ai-worker-web/playwright-report
            apps/ai-worker-web/test-results
          retention-days: 14

  # ── DDL 语法校验 ──────────────────────────────────────────────
  ddl-check:
    name: DDL Syntax Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: meeting_ci
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run All Migrations
        run: |
          for f in apps/meeting-api/meeting-api-infrastructure/src/main/resources/db/migration/V*.sql; do
            echo "Applying $(basename "$f")..."
            PGPASSWORD=meeting_ci psql -h localhost -U meeting -d meeting_ci -f "$f" -v ON_ERROR_STOP=1
          done

  # ── Secret 扫描 (G1/G2) ───────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can scan all commits in PRs

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── K8s 清单 lint (G3) ────────────────────────────────────────
  k8s-lint:
    name: K8s Manifests Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.4.3
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Lint dev overlay
        run: |
          kustomize build infra/meeting-infra/k8s/overlays/dev \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: Lint prod overlay
        run: |
          kustomize build infra/meeting-infra/k8s/overlays/prod \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

  # ── Playwright E2E (I5) ───────────────────────────────────────
  meeting-web-e2e:
    name: Meeting Web E2E (Playwright)
    runs-on: ubuntu-24.04
    # The full-stack compose pulls multiple service images; do not block
    # PR merges on transient image-pull issues. Re-enable as required:
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/meeting-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/meeting-web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Boot full-stack (postgres + rabbit + meeting-api)
        working-directory: .
        # meeting.storage.type defaults to "oss", so AliyunOssObjectStorageGateway
        # is wired and its constructor fail-fasts unless endpoint + credentials are
        # present — otherwise the meeting-api container never reaches readiness.
        # The E2E suite skips all audio-upload/storage scenarios here (they are
        # gated on E2E_AUDIO_FIXTURE, which CI does not set), so supply syntactically
        # valid dummy OSS values purely so the app boots; OSSClientBuilder.build()
        # does no network I/O at construction and the gateway is never called.
        env:
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_ACCESS_KEY_ID: e2e-dummy-access-key-id
          OSS_ACCESS_KEY_SECRET: e2e-dummy-access-key-secret
        run: |
          docker compose --profile full-stack \
              -f infra/meeting-infra/docker/compose/docker-compose.yml \
              up -d --quiet-pull
          # Poll the readiness probe rather than the aggregate health
          # endpoint: AiWorkerHealthIndicator marks /actuator/health DOWN
          # whenever ai-worker is unreachable, and ai-worker lives in the
          # `workstation` profile that CI does not start. The readiness
          # group ignores arbitrary HealthIndicators, so it flips UP as
          # soon as Flyway + Tomcat are ready — exactly what E2E needs.
          for i in $(seq 1 36); do
            if curl -fsSL http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "meeting-api ready after ${i} attempts"
              break
            fi
            sleep 5
          done
          if ! curl -fsSL http://localhost:8080/actuator/health/readiness; then
            echo "::error::meeting-api never came up"
            echo "── docker compose ps ──"
            docker compose -f infra/meeting-infra/docker/compose/docker-compose.yml ps
            echo "── docker compose logs --no-color meeting-api ──"
            docker compose -f infra/meeting-infra/docker/compose/docker-compose.yml \
                logs --no-color --tail=400 meeting-api || true
            exit 1
          fi

      - name: Run vite dev server
        run: |
          npm run dev -- --host 0.0.0.0 &
          for i in $(seq 1 24); do
            if curl -fsSL http://localhost:5173 > /dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run E2E
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE: http://localhost:8080
        run: npm run e2e

      - name: Upload Playwright trace + HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/meeting-web/playwright-report
            apps/meeting-web/test-results
          retention-days: 14
