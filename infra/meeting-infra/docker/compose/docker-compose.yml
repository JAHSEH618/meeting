# 本地会议智能系统 · 本地开发环境
# 用途：本地开发/联调；不适用于生产。
# 启动：cp .env.example .env && docker compose up -d

services:
  # ── 数据与基础设施 ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: meeting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting}
      POSTGRES_USER: ${POSTGRES_USER:-meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeting} -d ${POSTGRES_DB:-meeting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: meeting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-meeting}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-meeting_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-dev:
    image: hashicorp/vault:1.17
    container_name: meeting-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-meeting-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    volumes:
      - ./vault/init.sh:/usr/local/bin/vault-init.sh:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: >
      /bin/sh -c "
      vault server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:-meeting-dev-root-token} -dev-listen-address=0.0.0.0:8200 &
      sleep 3;
      /usr/local/bin/vault-init.sh;
      wait
      "

  # ── 应用服务（profile: full-stack）─────────────────────────
  # `docker compose --profile full-stack up -d meeting-api`
  meeting-api:
    image: meeting-api:dev
    container_name: meeting-api
    profiles: ["full-stack"]
    build:
      context: ../../../../apps/meeting-api
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${MEETING_API_APT_MIRROR:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-meeting}
      POSTGRES_USER: ${POSTGRES_USER:-meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-meeting}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-meeting_dev}
      STORAGE_TYPE: ${STORAGE_TYPE:-oss}
      STORAGE_BUCKET_AUDIO: ${STORAGE_BUCKET_AUDIO:-meeting-audio-auska}
      STORAGE_BUCKET_ARTIFACTS: ${STORAGE_BUCKET_ARTIFACTS:-meeting-artifacts}
      STORAGE_BUCKET_EXPORTS: ${STORAGE_BUCKET_EXPORTS:-meeting-exports}
      TOS_ENDPOINT: ${TOS_ENDPOINT:-}
      TOS_REGION: ${TOS_REGION:-cn-beijing}
      TOS_ACCESS_KEY_ID: ${TOS_ACCESS_KEY_ID:-}
      TOS_ACCESS_KEY_SECRET: ${TOS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-cn-hangzhou}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # Default to the compose ai-worker service. Apple Silicon real-model
      # runs can point meeting-api at a host-native ai-worker with:
      #   AI_WORKER_BASE_URL=http://host.docker.internal:8090
      AI_WORKER_BASE_URL: ${AI_WORKER_BASE_URL:-http://ai-worker:8090}
      AI_WORKER_CALLBACK_HMAC_SECRET: ${AI_WORKER_CALLBACK_HMAC_SECRET:-change-me-callback-fallback-secret}
      AI_WORKER_INTERNAL_API_HMAC_SECRET: ${AI_WORKER_INTERNAL_API_HMAC_SECRET:-change-me-internal-fallback-secret}
      CHUNK_STRATEGY_VERSION: v1
      KMS_MASTER_KEY_ID: ${KMS_MASTER_KEY_ID:-dev-kms-master-key}
      LIBREOFFICE_BINARY: soffice
      LIBREOFFICE_TIMEOUT_SECONDS: "60"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    ports:
      - "${MEETING_API_PORT:-8080}:8080"
    healthcheck:
      # readiness ignores AiWorkerHealthIndicator; if we polled the
      # aggregate /actuator/health instead, meeting-api would stay
      # "unhealthy" whenever ai-worker is not part of the started
      # profile — which also breaks the workstation depends_on chain.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── ai-worker (Phase 9 P6 / E1.7) ──────────────────────────────
  # CPU fake-mode build of ai-worker that also serves the workstation
  # SPA at /workstation/* and the BFF at /admin/*. Bring up the full
  # workstation stack with:
  #     docker compose --profile workstation up -d
  ai-worker:
    image: ai-worker:dev
    container_name: ai-worker
    profiles: ["workstation"]
    build:
      # The Dockerfile expects the repo root as context so the SPA build
      # stage can COPY apps/ai-worker-web/.
      context: ../../../../
      dockerfile: apps/ai-worker/Dockerfile
      args:
        BASE: python:3.11-slim
    depends_on:
      rabbitmq:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
    environment:
      AI_WORKER_USE_FAKE_RUNTIME: "true"
      AI_WORKER_USE_FAKE_ASR_RUNTIME: "true"
      AI_WORKER_USE_FAKE_DIARIZATION_RUNTIME: "true"
      AI_WORKER_RABBITMQ_HOST: rabbitmq
      AI_WORKER_RABBITMQ_PORT: "5672"
      AI_WORKER_RABBITMQ_USERNAME: ${RABBITMQ_USER:-meeting}
      AI_WORKER_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-meeting_dev}
      AI_WORKER_MEETING_API_BASE_URL: http://meeting-api:8080
      AI_WORKER_JAVA_API_BASE_URL: http://meeting-api:8080
      AI_WORKER_CALLBACK_HMAC_SECRET: ${AI_WORKER_CALLBACK_HMAC_SECRET:-change-me-callback-fallback-secret}
      AI_WORKER_INTERNAL_API_HMAC_SECRET: ${AI_WORKER_INTERNAL_API_HMAC_SECRET:-change-me-internal-fallback-secret}
      AI_WORKER_ADMIN_JWT_SECRET: ${AI_WORKER_ADMIN_JWT_SECRET:-dev-admin-secret-32-bytes-fixed}
      AI_WORKER_ADMIN_JWT_AUDIENCE: ai-worker-admin
      AI_WORKER_ADMIN_JWT_ISSUER: meeting-api
      AI_WORKER_ENROLLMENT_TMP_DIR: /var/lib/ai-worker/enrollment
      AI_WORKER_ADMIN_UI_DIST_PATH: /app/admin-ui
    ports:
      - "${AI_WORKER_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/internal/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── 可观测性（本地开发可选）────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: meeting-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.3
    container_name: meeting-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../../observability/dashboards:/var/lib/grafana/dashboards-spec:ro

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
