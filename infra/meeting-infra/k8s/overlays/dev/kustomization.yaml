apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay: 1 replica per app, low resource requests, image tag :dev.
namespace: meeting-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: meeting-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: meeting-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Deployment
      name: meeting-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: meeting-api
    newTag: dev
  - name: meeting-web
    newTag: dev
  - name: ai-worker
    newTag: dev
