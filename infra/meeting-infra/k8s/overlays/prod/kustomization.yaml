# Prod overlay — pinned image tags, full HPA, prod-tier resources.
# Image tags are placeholders; the deploy pipeline replaces them with
# the released digest before kustomize build.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meeting-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: meeting-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: meeting-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  # ProdProfileValidator activates with `prod` and fail-fasts on any of:
  # demo HMAC secrets, localhost AI worker base URL, dev KMS key id,
  # llm.allow-confidential=true, or flyway baseline-on-migrate=true. The
  # validator only runs when SPRING_PROFILES_ACTIVE=prod is set, so this
  # patch is the switch that turns it on for the prod overlay. Flyway
  # baseline override lives here too because application.yml ships
  # baseline-on-migrate: true (dev-friendly default), but prod must
  # never silently baseline against an unknown schema state.
  - target:
      kind: ConfigMap
      name: meeting-api-config
    patch: |
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: "prod"
      - op: add
        path: /data/SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - op: replace
        path: /data/STORAGE_TYPE
        value: "oss"
      - op: add
        path: /data/OSS_ENDPOINT
        value: "https://oss-cn-hangzhou-internal.aliyuncs.com"
      - op: add
        path: /data/OSS_REGION
        value: "cn-hangzhou"

images:
  - name: meeting-api
    newTag: v0.1.0  # replaced by CI
  - name: meeting-web
    newTag: v0.1.0
  - name: ai-worker
    # Phase J ML — prod runs with AI_WORKER_USE_FAKE_*_RUNTIME=false, so
    # the image MUST be the CUDA build (deploy.sh builds it with
    # UV_EXTRAS=real-models). The plain `v0.1.0` tag is the lean
    # CPU/fake image and would cause /internal/ready to 503 on missing
    # FlagEmbedding / funasr / pyannote.audio. Keep the `cuda-` prefix.
    newTag: cuda-v0.1.0
