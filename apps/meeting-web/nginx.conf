# Production nginx for the meeting-web SPA.
# Use with the multi-stage Dockerfile in apps/meeting-web/Dockerfile.

# Run as non-root: use /tmp for PID file (nginx user can write here)
pid /tmp/nginx.pid;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ─────────────────────────────────────
    # Strict CSP: same-origin only for scripts, styles, connect.
    # `'unsafe-inline'` on style-src is the minimum needed for Vite's
    # injected styles after `npm run build`; replace with a per-build
    # nonce/hash list when we add a CSP report endpoint.
    add_header Content-Security-Policy
        "default-src 'self'; \
         connect-src 'self'; \
         img-src 'self' data:; \
         style-src 'self' 'unsafe-inline'; \
         font-src 'self' data:; \
         script-src 'self'; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─── Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ─── Static SPA ───────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|png|jpe?g|svg|gif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # ─── Health probe ─────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }
}
