spring:
  application:
    name: meeting-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:meeting}
    username: ${POSTGRES_USER:meeting}
    password: ${POSTGRES_PASSWORD:meeting_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:meeting}
    password: ${RABBITMQ_PASS:meeting_dev}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Meeting API 业务配置 ──────────────────────────────────────────
meeting:
  # 后台调度（outbox publisher、lease scanner、deletion runner、
  # break-glass scanner）共享的活跃租户列表。每个 scheduler 也保留
  # 了独立的 meeting.<scheduler>.tenants 兜底键，但生产请只用本键。
  # prod profile 必须显式列出（ProdProfileValidator 会校验非空）。
  tenants:
    active: ${MEETING_TENANTS_ACTIVE:tenant_default}
  # 鉴权实现挑选。in-memory = InMemoryAuthApplicationService（dev/test
  # 唯一可用，admin/admin123）。prod 必须切换到 jwt/oidc 等真实实现，
  # 否则 ProdProfileValidator 会拒绝启动。
  auth:
    mode: ${MEETING_AUTH_MODE:in-memory}
  admin-jwt:
    secret: ${AI_WORKER_ADMIN_JWT_SECRET:dev-admin-secret-32-bytes-fixedXX}
    audience: ${AI_WORKER_ADMIN_JWT_AUDIENCE:ai-worker-admin}
    issuer: ${AI_WORKER_ADMIN_JWT_ISSUER:meeting-api}
  security:
    callback:
      hmac-secret: ${AI_WORKER_CALLBACK_HMAC_SECRET:change-me-callback-fallback-secret}
      timestamp-skew-seconds: 300
    ai-worker:
      hmac-secret: ${AI_WORKER_INTERNAL_API_HMAC_SECRET:change-me-internal-fallback-secret}
      base-url: ${AI_WORKER_BASE_URL:http://localhost:8090}
      rerank-timeout-ms: 3000
      embed-timeout-ms: 3000
      warmup-timeout-ms: 5000
      models-timeout-ms: 2000
      connect-timeout-ms: 1000
      # Circuit breaker on the rerank call: after N consecutive
      # unavailable/timeout outcomes, short-circuit to the RRF fallback for
      # open-ms instead of paying the rerank timeout on every RAG query.
      # threshold 0 disables the breaker.
      rerank-breaker-failure-threshold: 5
      rerank-breaker-open-ms: 30000
  storage:
    type: ${STORAGE_TYPE:oss}
    # Logical bucket names — shared by every backend. Override per env
    # via STORAGE_BUCKET_* env vars; the TOS gateway uses these directly.
    bucket-audio: ${STORAGE_BUCKET_AUDIO:meeting-audio-auska}
    bucket-artifacts: ${STORAGE_BUCKET_ARTIFACTS:meeting-artifacts}
    bucket-exports: ${STORAGE_BUCKET_EXPORTS:meeting-exports}
    tos:
      endpoint: ${TOS_ENDPOINT:}
      region: ${TOS_REGION:cn-beijing}
      access-key-id: ${TOS_ACCESS_KEY_ID:}
      access-key-secret: ${TOS_ACCESS_KEY_SECRET:}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      region: ${OSS_REGION:cn-hangzhou}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  chunk:
    strategy-version: ${CHUNK_STRATEGY_VERSION:v1}
    default-size-seconds: 60
    min-size-seconds: 30
    max-size-seconds: 120
    overlap-seconds: 0.5
  task:
    lease-duration-seconds: 120
    max-attempts: 3
    orphan-scan-interval-seconds: 60
  lease-scanner:
    enabled: true
    interval-ms: 30000
    initial-delay-ms: 30000
    batch-size: 50
  sse:
    heartbeat-interval-seconds: 15
    event-timeout-seconds: 300
  outbox:
    batch-size: 100
    max-retries: 5
  # Outbox 投递轮询（OutboxPublisherConfig）
  outbox-publisher:
    enabled: true
    interval-ms: 2000
    initial-delay-ms: 5000
  # Outbox 积压 gauge 采样（OutboxMetricsSamplerConfig，供 Prometheus 告警规则使用）
  outbox-metrics:
    enabled: true
    interval-ms: 30000
    initial-delay-ms: 15000
  # callback_nonces 过期清理（CallbackNonceCleanupConfig）
  callback-nonce-cleanup:
    enabled: true
    interval-ms: 300000
    initial-delay-ms: 120000
  llm:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      timeout-seconds: 60
      max-retries: 3
  export:
    download-ttl-hours: 24
    libreoffice:
      binary: ${LIBREOFFICE_BINARY:soffice}
      timeout-seconds: ${LIBREOFFICE_TIMEOUT_SECONDS:60}
  kms:
    master-key-id: ${KMS_MASTER_KEY_ID:dev-kms-master-key}

# ── 日志 ──────────────────────────────────────────────────────────
logging:
  level:
    com.meeting.api: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO
