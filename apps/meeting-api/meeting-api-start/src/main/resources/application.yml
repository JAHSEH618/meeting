spring:
  application:
    name: meeting-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:meeting}
    username: ${POSTGRES_USER:meeting}
    password: ${POSTGRES_PASSWORD:meeting_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:meeting}
    password: ${RABBITMQ_PASS:meeting_dev}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Meeting API 业务配置 ──────────────────────────────────────────
meeting:
  security:
    callback:
      hmac-secret: ${AI_WORKER_CALLBACK_HMAC_SECRET:change-me-callback-fallback-secret}
      timestamp-skew-seconds: 300
    ai-worker:
      hmac-secret: ${AI_WORKER_INTERNAL_API_HMAC_SECRET:change-me-internal-fallback-secret}
      base-url: ${AI_WORKER_BASE_URL:http://localhost:8090}
      rerank-timeout-ms: 3000
  storage:
    type: ${STORAGE_TYPE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket-audio: meeting-audio
      bucket-artifacts: meeting-artifacts
      bucket-exports: meeting-exports
    tos:
      endpoint: ${TOS_ENDPOINT:}
      region: ${TOS_REGION:cn-beijing}
      access-key: ${TOS_ACCESS_KEY:}
      secret-key: ${TOS_SECRET_KEY:}
      bucket-audio: meeting-audio
      bucket-artifacts: meeting-artifacts
      bucket-exports: meeting-exports
  chunk:
    strategy-version: ${CHUNK_STRATEGY_VERSION:v1}
    default-size-seconds: 60
    min-size-seconds: 30
    max-size-seconds: 120
    overlap-seconds: 0.5
  task:
    lease-duration-seconds: 300
    max-attempts: 3
    orphan-scan-interval-seconds: 60
  sse:
    heartbeat-interval-seconds: 15
    event-timeout-seconds: 300
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 5
    retry-backoff-ms: 1000
  llm:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      timeout-seconds: 60
      max-retries: 3
    security-level-blocked:
      - CONFIDENTIAL
      - SECRET

# ── 日志 ──────────────────────────────────────────────────────────
logging:
  level:
    com.meeting.api: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO
