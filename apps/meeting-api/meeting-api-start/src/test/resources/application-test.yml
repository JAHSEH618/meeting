spring:
  datasource:
    url: ${TESTCONTAINERS_POSTGRES_URL}
    username: ${TESTCONTAINERS_POSTGRES_USER:meeting}
    password: ${TESTCONTAINERS_POSTGRES_PASSWORD:meeting_test}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${TESTCONTAINERS_RABBITMQ_HOST:localhost}
    port: ${TESTCONTAINERS_RABBITMQ_PORT:5672}
    username: guest
    password: guest

server:
  port: 0

meeting:
  tenants:
    active: tenant_01,tenant_default
  export:
    consumer:
      enabled: false   # tests drive ExportQueueConsumer via onMessage() directly
  # The full @SpringBootTest context (AuthRefreshFlowIT, CallbackNonceRepositoryIT)
  # wires an ObjectStorageGateway. meeting.storage.type defaults to "oss"
  # (application.yml), and AliyunOssObjectStorageGateway's constructor requires
  # endpoint + credentials or it fails context load. These ITs never touch object
  # storage, so supply syntactically-valid dummy values — OSSClientBuilder.build()
  # performs no network I/O at construction time.
  storage:
    type: oss
    oss:
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      region: cn-hangzhou
      access-key-id: test-access-key-id
      access-key-secret: test-access-key-secret
