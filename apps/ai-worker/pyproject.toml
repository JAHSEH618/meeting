[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jsonschema>=4.0,<5.0"
]

[project.scripts]
ai-worker-api = "ai_worker.interfaces.api.main:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["ai_worker"]
exclude = ["ai_worker/generated"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.setuptools.packages.find]
include = ["ai_worker*"]