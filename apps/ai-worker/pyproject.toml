[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jsonschema>=4.0,<5.0",
  "prometheus-client>=0.20,<1.0",
  "pika>=1.3,<2.0",
]

[project.scripts]
ai-worker-api = "ai_worker.interfaces.api.main:run"
ai-worker-consumer = "ai_worker.interfaces.workers.rabbitmq:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1"
]
# Heavy ML deps for real model runtimes (bge-m3 / bge-reranker-v2-m3).
# Not installed by default — coding / CI runs with fake runtime via
# AI_WORKER_USE_FAKE_RUNTIME=true. Enable locally with
#   uv sync --extra real-models
# and flip AI_WORKER_USE_FAKE_RUNTIME=false to exercise real weights.
real-models = [
  "torch>=2.3,<3.0",
  "transformers>=4.44,<5.0",
  "FlagEmbedding>=1.3,<2.0",
  "sentencepiece>=0.2,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_models: opt-in tests that exercise real bge-m3 / bge-reranker weights; require `uv sync --extra real-models` and an explicit AI_WORKER_USE_FAKE_RUNTIME=false",
]

[tool.pyright]
include = ["ai_worker"]
exclude = ["ai_worker/generated"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.setuptools.packages.find]
include = ["ai_worker*"]
