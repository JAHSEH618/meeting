[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx[socks]>=0.27,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jsonschema>=4.0,<5.0",
  "prometheus-client>=0.20,<1.0",
  "pika>=1.3,<2.0",
  "tos>=2.6,<3.0",
]

[project.scripts]
ai-worker-api = "ai_worker.interfaces.api.main:run"
ai-worker-consumer = "ai_worker.interfaces.workers.rabbitmq:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1"
]
# Heavy ML deps grouped by capability. Production deploys install exactly
# the extras they need (bge-only embedding workers don't pull pyannote;
# pure-LLM workers skip all of them). Coding / CI uses fake runtimes so
# none of these are installed by default — flip the corresponding
# AI_WORKER_USE_FAKE_*_RUNTIME=false and `uv sync --extra <capability>`.
#
#   uv sync --extra real-bge            # embedding + reranker
#   uv sync --extra real-asr            # Qwen3-ASR via funasr
#   uv sync --extra real-diarization    # pyannote.audio 3.x
#   uv sync --extra real-models         # everything above (single-host all-GPU box)
real-bge = [
  "torch>=2.3,<3.0",
  "transformers>=4.44,<5.0",
  "FlagEmbedding>=1.3,<2.0",
  "sentencepiece>=0.2,<1.0",
]
real-asr = [
  "torch>=2.3,<3.0",
  "funasr>=1.1,<2.0",
  "modelscope>=1.18,<2.0",
  "soundfile>=0.12,<1.0",
]
real-diarization = [
  "torch>=2.3,<3.0",
  "torchaudio>=2.3,<3.0",
  "pyannote.audio>=3.3,<4.0",
]
real-models = [
  "torch>=2.3,<3.0",
  "torchaudio>=2.3,<3.0",
  "transformers>=4.44,<5.0",
  "FlagEmbedding>=1.3,<2.0",
  "sentencepiece>=0.2,<1.0",
  "funasr>=1.1,<2.0",
  "modelscope>=1.18,<2.0",
  "soundfile>=0.12,<1.0",
  "pyannote.audio>=3.3,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_models: opt-in tests that exercise real bge-m3 / bge-reranker weights; require `uv sync --extra real-models` and an explicit AI_WORKER_USE_FAKE_RUNTIME=false",
]

[tool.pyright]
include = ["ai_worker"]
exclude = ["ai_worker/generated"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.setuptools.packages.find]
include = ["ai_worker*"]
