services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

  meeting-api:
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-meeting}
      POSTGRES_USER: ${POSTGRES_USER:-meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-meeting}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_BUCKET_AUDIO: ${STORAGE_BUCKET_AUDIO}
      STORAGE_BUCKET_ARTIFACTS: ${STORAGE_BUCKET_ARTIFACTS}
      STORAGE_BUCKET_EXPORTS: ${STORAGE_BUCKET_EXPORTS}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_REGION: ${OSS_REGION}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      AI_WORKER_BASE_URL: ${AI_WORKER_BASE_URL}
      AI_WORKER_CALLBACK_HMAC_SECRET: ${AI_WORKER_CALLBACK_HMAC_SECRET}
      AI_WORKER_INTERNAL_API_HMAC_SECRET: ${AI_WORKER_INTERNAL_API_HMAC_SECRET}
      KMS_MASTER_KEY_ID: ${KMS_MASTER_KEY_ID}
      MEETING_KMS_MASTER_KEY_BASE64: ${MEETING_KMS_MASTER_KEY_BASE64}
      MEETING_STORAGE_ENDPOINT: ${OSS_ENDPOINT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
