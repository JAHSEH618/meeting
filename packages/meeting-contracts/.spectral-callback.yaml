extends:
  - spectral:oas

rules:
  operation-operationId: error

  meeting-operation-id-lower-camel:
    description: operationId must use lowerCamelCase.
    severity: error
    given: $.paths[*][get,post,put,patch,delete].operationId
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z0-9]*$"

  # ── Callback API server prefix ────────────────────────────────────
  meeting-callback-internal-server-prefix:
    description: Internal callback API must declare /internal as server prefix so generated clients sign the full request path.
    severity: error
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          if:
            type: object
            required:
              - info
            properties:
              info:
                type: object
                required:
                  - title
                properties:
                  title:
                    pattern: "(Internal|internal).*Callback|Callback.*(Internal|internal)"
          then:
            type: object
            properties:
              servers:
                type: array
                contains:
                  type: object
                  required:
                    - url
                  properties:
                    url:
                      const: /internal
            required:
              - servers

  # ── Callback API required headers ──────────────────────────────────
  meeting-callback-worker-id:
    description: Callback operations must declare X-Worker-Id.
    severity: error
    given: $.paths[*][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/WorkerId"

  meeting-callback-attempt-no:
    description: Callback operations must declare X-Attempt-No.
    severity: error
    given: $.paths[*][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/AttemptNo"

  meeting-callback-lease-owner:
    description: Callback operations must declare X-Lease-Owner.
    severity: error
    given: $.paths[*][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/LeaseOwner"

  meeting-callback-timestamp-nonce-signature:
    description: Callback operations must declare X-Timestamp, X-Nonce, X-Signature.
    severity: error
    given: $.paths[*][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          allOf:
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Timestamp"
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Nonce"
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Signature"

  # ── 4xx / 5xx response 必须引用统一 ApiResponse schema ─────────────
  meeting-4xx-error-response:
    description: 4xx responses must use ApiResponse envelope.
    severity: error
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property.match(/^4/))]
    then:
      field: content.application/json.schema
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            "$ref":
              const: "#/components/schemas/ApiResponse"

  meeting-5xx-error-response:
    description: 5xx responses must use ApiResponse envelope.
    severity: error
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property.match(/^5/))]
    then:
      field: content.application/json.schema
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            "$ref":
              const: "#/components/schemas/ApiResponse"