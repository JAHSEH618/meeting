extends:
  - spectral:oas

rules:
  # ── 基础规则 ──────────────────────────────────────────────────
  operation-operationId: error

  meeting-operation-id-lower-camel:
    description: operationId must use lowerCamelCase.
    severity: error
    given: $.paths[*][get,post,put,patch,delete].operationId
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z0-9]*$"

  meeting-callback-internal-server-prefix:
    description: Internal callback API must declare /internal as server prefix so generated clients sign the full request path.
    severity: error
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          if:
            type: object
            required:
              - paths
            properties:
              paths:
                type: object
                required:
                  - /processing-tasks/{taskId}/steps/{stepName}
          then:
            type: object
            properties:
              servers:
                type: array
                contains:
                  type: object
                  required:
                    - url
                  properties:
                    url:
                      const: /internal
            required:
              - servers

  # ── Public API 写操作必须声明 header ──────────────────────────
  meeting-public-write-request-id:
    description: Public API mutating operations except login must declare X-Request-Id.
    severity: error
    given: $.paths[?(@property != "/auth/login")][post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/XRequestId"

  meeting-public-write-trace-id:
    description: Public API mutating operations except login must declare X-Trace-Id.
    severity: error
    given: $.paths[?(@property != "/auth/login")][post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/XTraceId"

  meeting-public-write-idempotency-key:
    description: Public API mutating operations except login must declare Idempotency-Key.
    severity: error
    given: $.paths[?(@property != "/auth/login")][post,put,patch,delete]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/IdempotencyKey"

  # ── Callback API 规则（仅匹配 callback 专属路径，避免误伤 public-api）──
  # callback paths: /processing-tasks/{taskId}/steps|artifacts|transcript|speaker-candidates|embeddings|complete|fail
  meeting-callback-worker-id:
    description: Callback operations must declare X-Worker-Id.
    severity: error
    given: $.paths[?(@property =~ /^\/processing-tasks\/\{taskId\}\/(steps|artifacts|transcript|speaker-candidates|embeddings|complete|fail)\b/)][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/WorkerId"

  meeting-callback-attempt-no:
    description: Callback operations must declare X-Attempt-No.
    severity: error
    given: $.paths[?(@property =~ /^\/processing-tasks\/\{taskId\}\/(steps|artifacts|transcript|speaker-candidates|embeddings|complete|fail)\b/)][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/AttemptNo"

  meeting-callback-lease-owner:
    description: Callback operations must declare X-Lease-Owner.
    severity: error
    given: $.paths[?(@property =~ /^\/processing-tasks\/\{taskId\}\/(steps|artifacts|transcript|speaker-candidates|embeddings|complete|fail)\b/)][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              "$ref":
                const: "#/components/parameters/LeaseOwner"

  meeting-callback-timestamp-nonce-signature:
    description: Callback operations must declare X-Timestamp, X-Nonce, X-Signature.
    severity: error
    given: $.paths[?(@property =~ /^\/processing-tasks\/\{taskId\}\/(steps|artifacts|transcript|speaker-candidates|embeddings|complete|fail)\b/)][post,patch]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          allOf:
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Timestamp"
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Nonce"
            - contains:
                type: object
                properties:
                  "$ref":
                    const: "#/components/parameters/Signature"

  # ── 4xx response 必须引用统一 ApiResponse schema ─────────────
  meeting-4xx-error-response:
    description: 4xx responses must use ApiResponse envelope.
    severity: warn
    given: $.paths[*][get,post,put,patch,delete].responses[?(@property.match(/^4/))]
    then:
      field: content.application/json.schema
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            "$ref":
              const: "#/components/schemas/ApiResponse"
