          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'

  /exports/{exportId}:
    get:
      operationId: getExport
      description: Retrieve an export job status and download URL.
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Export job status + download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /exports/{exportId}/cancel:
    post:
      operationId: cancelExport
      description: Cancel an in-progress export job.
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /exports/{exportId}/revoke-link:
    post:
      operationId: revokeExportLink
      description: Revoke the download URL of a completed export.
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── Compliance / Admin ──────────────────────────────────────
  /legal-holds:
    get:
      operationId: listLegalHolds
      description: List legal holds in the current tenant.
      tags: [Compliance]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/OkPaginated'
    post:
      operationId: createLegalHold
      description: Place a legal hold on one or more entities.
      tags: [Compliance]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalHoldRequest'
      responses:
        '201':
          description: Legal hold created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /legal-holds/{legalHoldId}:
    get:
      operationId: getLegalHold
      description: Retrieve a legal hold by ID.
      tags: [Compliance]
      parameters:
        - $ref: '#/components/parameters/LegalHoldId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      operationId: deleteLegalHold
      description: Delete a legal hold (alias for release).
      tags: [Compliance]
      parameters:
        - $ref: '#/components/parameters/LegalHoldId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseLegalHoldRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /legal-holds/{legalHoldId}/release:
    put:
      operationId: releaseLegalHold
      description: Release a legal hold and unfreeze affected entities.
      tags: [Compliance]
      parameters:
        - $ref: '#/components/parameters/LegalHoldId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/deletion-jobs:
    get:
      operationId: listDeletionJobs
      description: List data deletion jobs in the current tenant.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/OkPaginated'
    post:
      operationId: createDeletionJob
      description: Create a data deletion job for specified entities.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeletionJobRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/deletion-jobs/{jobId}:
    get:
      operationId: getDeletionJob
      description: Retrieve a deletion job by ID.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/deletion-jobs/{jobId}/certificate:
    get:
      operationId: getDeletionCertificate
      description: Retrieve the deletion certificate for a completed job.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/break-glass/requests:
    get:
      operationId: listBreakGlassRequests
      description: List break-glass access requests.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/OkPaginated'
    post:
      operationId: createBreakGlassRequest
      description: Request temporary elevated access to restricted data.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBreakGlassRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/break-glass/requests/{requestId}/approve:
    post:
      operationId: approveBreakGlassRequest
      description: Approve a pending break-glass access request.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/BreakGlassRequestId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBreakGlassRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/break-glass/requests/{requestId}/reject:
    post:
      operationId: rejectBreakGlassRequest
      description: Reject a pending break-glass access request.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/BreakGlassRequestId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectBreakGlassRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /admin/break-glass/audit:
    get:
      operationId: listBreakGlassAudit
      description: List the break-glass access audit trail.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/OkPaginated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string}
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema: {type: string}
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    XTraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema: {type: string}
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: {type: string}
    SpeakerLabel:
      name: speakerLabel
      in: path
      required: true
      schema: {type: string}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string}
    ExportId:
      name: exportId
      in: path
      required: true
      schema: {type: string}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string}
    LegalHoldId:
      name: legalHoldId
      in: path
      required: true
      schema: {type: string}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string}
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema: {type: string}

  responses:
    Ok:
      description: Standard success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    OkEmpty:
      description: Success with no data body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    OkPaginated:
      description: Paginated success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: Version or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unprocessable:
      description: Semantic validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Locked:
      description: Resource locked (legal hold, account lockout)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    PayloadTooLarge:
      description: Upload exceeds size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Gone:
      description: SSE event window expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    # ── Envelope ───────────────────────────────────────────────
    ApiResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data: {}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    ErrorInfo:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        details:
          type: object
          additionalProperties: true

    # ── User Requests ─────────────────────────────────────────
    CreateUserRequest:
      type: object
      required: [username, displayName, roles]
      properties:
        username: {type: string, minLength: 1}
        displayName: {type: string, minLength: 1}
        email: {type: [string, 'null'], format: email}
        personId: {type: [string, 'null']}
        roles:
          type: array
          minItems: 1
          items: {type: string}

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName: {type: string}
        email: {type: [string, 'null'], format: email}
        enabled: {type: boolean}
        roles:
          type: array
          items: {type: string}
        expectedVersion: {type: integer, minimum: 0}

    # ── Auth ───────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}

    LoginResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [accessToken, expiresAt, user]
          properties:
            accessToken: {type: string}
            expiresAt: {type: string, format: date-time}
            user:
              $ref: '#/components/schemas/AuthUser'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    AuthUserResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/AuthUser'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    AuthUser:
      type: object
      required: [userId, tenantId, displayName, roles, permissions]
      properties:
        userId: {type: string}
        tenantId: {type: string}
        personId: {type: string}
        displayName: {type: string}
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {type: string}

    # ── Person ─────────────────────────────────────────────────
    CreatePersonRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName: {type: string, minLength: 1, maxLength: 128}
        email: {type: [string, 'null'], format: email, maxLength: 254}
        externalId: {type: [string, 'null'], maxLength: 128}
        forceCreate:
          type: boolean
          default: false
          description: Skip duplicate displayName short-circuit when true.

    Person:
      type: object
      required: [personId, displayName, createdAt]
      additionalProperties: false
      properties:
        personId: {type: string}
        displayName: {type: string, maxLength: 128}
        email: {type: [string, 'null'], maxLength: 254}
        externalId: {type: [string, 'null'], maxLength: 128}
        createdAt: {type: string, format: date-time}

    PersonResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/Person'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    PersonListResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    PersonDuplicateResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean, enum: [false]}
        data:
          type: 'null'
        error:
          type: object
          required: [code, message, retryable, details]
          properties:
            code: {type: string, enum: [PERSON_DUPLICATE]}
            message: {type: string}
            retryable: {type: boolean, enum: [false]}
            details:
              type: object
              required: [matches]
              properties:
                matches:
                  type: array
                  items:
                    $ref: '#/components/schemas/Person'
        requestId: {type: string}
        traceId: {type: string}

    # ── Meeting ────────────────────────────────────────────────
    CreateMeetingRequest:
      type: object
      required: [title, securityLevel]
      properties:
        title: {type: string}
        scheduledStartAt:
          type: string
          format: date-time
        securityLevel:
          $ref: '#/components/schemas/SecurityLevel'
        language: {type: string, default: 'zh'}
        participants:
          type: array
          items:
            type: object
            required: [personId, displayName, role]
            properties:
              personId: {type: string}
              displayName: {type: string}
              role: {type: string}

    UpdateMeetingRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1}
        scheduledStartAt: {type: [string, 'null'], format: date-time}
        participants:
          type: array
          items:
            type: object
            required: [personId, displayName, role]
            properties:
              personId: {type: string}
              displayName: {type: string}
              role: {type: string}
        expectedVersion: {type: integer, minimum: 0}

    MeetingResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/Meeting'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    MeetingListResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Meeting'
            page:
              $ref: '#/components/schemas/PageInfo'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    Meeting:
      type: object
      required: [meetingId, tenantId, title, securityLevel, status, language, transcriptVersion, minutesVersion, createdAt]
      properties:
        meetingId: {type: string}
        tenantId: {type: string}
        title: {type: string}
        scheduledStartAt: {type: string, format: date-time}
        securityLevel:
          $ref: '#/components/schemas/SecurityLevel'
        status:
          $ref: '#/components/schemas/MeetingStatus'
        language: {type: string}
        transcriptVersion: {type: integer, minimum: 0}
        minutesVersion: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}

    PageInfo:
      type: object
      properties:
        cursor: {type: string}
        hasMore: {type: boolean}
        limit: {type: integer}

    # ── Generic File Upload ───────────────────────────────────
    CreateFileUploadRequest:
      type: object
      required: [fileName, contentType, fileSizeBytes, fileSha256]
      additionalProperties: false
      properties:
        fileName: {type: string, minLength: 1, maxLength: 255}
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - text/plain
            - text/markdown
        fileSizeBytes: {type: integer, format: int64, minimum: 1, maximum: 524288000}
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        partSizeBytes: {type: [integer, 'null'], format: int32, minimum: 1048576}

    CreateFileUploadPartRequest:
      type: object
      required: [partNumber, sizeBytes, partSha256]
      additionalProperties: false
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        partSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    CompleteFileUploadRequest:
      type: object
      required: [fileSha256, parts]
      additionalProperties: false
      properties:
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/FileUploadCompletePart'

    FileUploadCompletePart:
      type: object
      required: [partNumber, partSha256, etag]
      additionalProperties: false
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        partSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        etag: {type: string, minLength: 1}

    FileUploadSessionResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/FileUploadSession'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    FileUploadSession:
      type: object
      required: [uploadId, expiresAt, partSizeBytes, maxPartCount, contentType, fileName, fileSizeBytes, fileSha256, parts]
      additionalProperties: false
      properties:
        uploadId: {type: string}
        expiresAt: {type: string, format: date-time}
        partSizeBytes: {type: integer, minimum: 1048576}
        maxPartCount: {type: integer, minimum: 1, maximum: 10000, default: 10000}
        objectKey: {type: [string, 'null']}
        bucket: {type: [string, 'null']}
        contentType: {type: string}
        fileName: {type: string}
        fileSizeBytes: {type: integer, format: int64, minimum: 1}
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        fileId: {type: [string, 'null']}
        parts:
          type: array
          items:
            $ref: '#/components/schemas/FileUploadPart'

    FileUploadPartResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/FileUploadPart'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    FileUploadPart:
      type: object
      required: [partNumber, partSha256, sizeBytes, uploadUrl, expiresAt, headers]
      additionalProperties: false
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        partSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes: {type: integer, format: int64, minimum: 1}
        etag: {type: [string, 'null']}
        uploadUrl: {type: string}
        expiresAt: {type: string, format: date-time}
        headers:
          type: object
          additionalProperties: {type: string}

    FileUploadCompleteResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [fileId, sha256, sizeBytes, contentType]
          additionalProperties: false
          properties:
            fileId: {type: string}
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            sizeBytes: {type: integer, format: int64}
            contentType: {type: string}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    # ── Audio Upload ──────────────────────────────────────────
    CreateAudioUploadRequest:
      type: object
      required: [fileName, contentType, fileSizeBytes, fileSha256]
      additionalProperties: false
      properties:
        fileName: {type: string, minLength: 1}
        contentType: {type: string, minLength: 1}
        fileSizeBytes: {type: integer, minimum: 1}
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        partSizeBytes:
          type: integer
          minimum: 5242880
          default: 8388608
          description: |
            Requested part size. In single-PUT mode the server coerces this
            value to `max(requested, fileSizeBytes, 5 MiB)` so the resulting
            session always has exactly one part; supply the actual file size
            or let the server pick. Real multipart is not yet implemented.

    CreateAudioUploadPartRequest:
      type: object
      required: [partNumber, sizeBytes, partSha256]
      additionalProperties: false
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: |
            Size of this part in bytes. In single-PUT mode this equals the
            full file size (capped at 2 GiB by the server before the session
            is created).
        partSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    CompleteAudioUploadRequest:
      type: object
      required: [fileSha256, parts]
      additionalProperties: false
      properties:
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        durationMs: {type: [integer, 'null'], minimum: 1}
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [partNumber, partSha256, etag]
            additionalProperties: false
            properties:
              partNumber: {type: integer, minimum: 1, maximum: 10000}
              partSha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
              etag: {type: string, minLength: 1}

    AudioUploadSessionResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/AudioUploadSession'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    AudioUploadSession:
      type: object
      required: [uploadId, meetingId, uploadStatus, expiresAt, partSizeBytes, maxPartCount, contentType, fileName, fileSizeBytes, fileSha256, parts]
      additionalProperties: false
      properties:
        uploadId: {type: string}
        meetingId: {type: string}
        uploadStatus:
          $ref: '#/components/schemas/AudioUploadStatus'
        expiresAt: {type: string, format: date-time}
        partSizeBytes:
          type: integer
          minimum: 5242880
          default: 8388608
          description: |
            Effective per-part size after server coercion. In single-PUT
            mode this is `max(requested, fileSizeBytes, 5 MiB)` so
            `ceil(fileSizeBytes / partSizeBytes) == 1`.
        maxPartCount: {type: integer, minimum: 1, maximum: 10000, default: 10000}
        objectKey: {type: [string, 'null']}
        bucket: {type: [string, 'null']}
        contentType: {type: string}
        fileName: {type: string}
        fileSizeBytes: {type: integer, minimum: 1}
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        fileId: {type: [string, 'null']}
        parts:
          type: array
          items:
            $ref: '#/components/schemas/AudioUploadPart'

    AudioUploadPartResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [uploadId, partNumber, partSha256, uploadUrl, expiresAt, headers]
          additionalProperties: false
          properties:
            uploadId: {type: string}
            partNumber: {type: integer, minimum: 1, maximum: 10000}
            partSha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            etag: {type: [string, 'null']}
            uploadUrl: {type: string}
            expiresAt: {type: string, format: date-time}
            headers:
              type: object
              additionalProperties: {type: string}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    AudioUploadPart:
      type: object
      required: [partNumber, partSha256, sizeBytes, uploadStatus]
      additionalProperties: false
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        partSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        etag: {type: [string, 'null']}
        sizeBytes: {type: integer, minimum: 1}
        uploadStatus:
          $ref: '#/components/schemas/AudioUploadStatus'
        uploadedAt: {type: [string, 'null'], format: date-time}

    # ── Processing Task ────────────────────────────────────────
    CreateProcessingTaskRequest:
      type: object
      required: [taskType]
      properties:
        taskType:
          type: string
          enum: [MEETING_FULL_PIPELINE]
        options:
          type: object
          additionalProperties: true
        expectedInputVersion:
          type: object
          additionalProperties: true
        holdAtWorkerPhase:
          type: boolean
          default: false
          description: When true, Java's WorkerPhaseCompletedListener stops at WORKER_DAG_DONE and waits for an explicit resume-java-phase call before starting SUMMARY / EXTRACTION.

    ProcessingTaskResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/ProcessingTask'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    ProcessingTask:
      type: object
      required: [taskId, meetingId, status, phase, attemptNo, steps]
      properties:
        taskId: {type: string}
        meetingId: {type: [string, 'null']}
        status:
          $ref: '#/components/schemas/ProcessingTaskStatus'
        phase:
          $ref: '#/components/schemas/ProcessingTaskPhase'
        attemptNo: {type: integer}
        currentStep: {type: [string, 'null']}
        lastErrorCode: {type: [string, 'null']}
        retryable: {type: boolean}
        estimatedWaitSeconds: {type: integer}
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingTaskStep'

    ProcessingTaskStep:
      type: object
      required: [stepName, status, progress, source]
      properties:
        stepName:
          $ref: '#/components/schemas/ProcessingStep'
        status:
          $ref: '#/components/schemas/StepStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        heartbeatAt: {type: [string, 'null'], format: date-time}
        attemptNo: {type: [integer, 'null']}
        leaseOwner: {type: [string, 'null']}
        workerId: {type: [string, 'null']}
        retryable: {type: [boolean, 'null']}
        source:
          $ref: '#/components/schemas/ProcessingStepUpdateSource'

    TaskEvent:
      type: object
      required: [eventId, sequenceNo, eventType, taskId, status, emittedAt]
      properties:
        eventId: {type: string}
        sequenceNo: {type: integer}
        eventType:
          type: string
          enum: [TASK_SNAPSHOT, TASK_STARTED, TASK_STEP_UPDATED, TASK_HEARTBEAT, TRANSCRIPT_READY, TASK_FAILED, TASK_COMPLETED, TASK_CANCELLED, EXPORT_STATUS_CHANGED]
        taskId: {type: string}
        meetingId: {type: [string, 'null']}
        stepName: {type: [string, 'null']}
        status: {type: string}
        phase:
          anyOf:
            - $ref: '#/components/schemas/ProcessingTaskPhase'
            - type: 'null'
        progress: {type: [integer, 'null']}
        retryable: {type: [boolean, 'null']}
        errorCode: {type: [string, 'null']}
        emittedAt: {type: string, format: date-time}
        attemptNo: {type: [integer, 'null']}
        transcriptVersion: {type: [integer, 'null']}
        artifactManifestId: {type: [string, 'null']}
        completedSteps:
          type: [array, 'null']
          items: {type: string}
        steps:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ProcessingTaskStep'
        leaseExpiresAt: {type: [string, 'null'], format: date-time}

    # ── Transcript ─────────────────────────────────────────────
    UpdateTranscriptSegmentRequest:
      type: object
      required: [currentText, expectedTranscriptVersion]
      properties:
        currentText: {type: string}
        expectedTranscriptVersion: {type: integer, minimum: 0}

    RegenerateTranscriptDependentsRequest:
      type: object
      required: [regenerateScope, expectedTranscriptVersion]
      properties:
        regenerateScope:
          type: array
          minItems: 1
          items:
            type: string
            enum: [SUMMARY, ACTION_ITEMS, DECISIONS, RISKS, RAG_INDEXING, EXPORTS]
        expectedTranscriptVersion: {type: integer, minimum: 0}

    TranscriptResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [meetingId, transcriptVersion, staleStatus, segments]
          properties:
            meetingId: {type: string}
            transcriptVersion: {type: integer}
            staleStatus: {type: string}
            segments:
              type: array
              items:
                $ref: '#/components/schemas/TranscriptSegment'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    TranscriptSegment:
      type: object
      required: [segmentId, startMs, endMs, speakerLabel, originalText, currentText, asrConfidence, timestampPrecision]
      properties:
        segmentId: {type: string}
        startMs: {type: integer}
        endMs: {type: integer}
        speakerLabel: {type: string}
        speakerDisplayName: {type: [string, 'null']}
        originalText: {type: string}
        editedText: {type: [string, 'null']}
        currentText: {type: string}
        asrConfidence: {type: number, minimum: 0, maximum: 1}
        diarizationConfidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        timestampPrecision:
          type: string
          enum: [WORD, SEGMENT, APPROXIMATE]

    # ── Speakers ──────────────────────────────────────────────
    CreateSpeakerProfileRequest:
      type: object
      required: [personId, displayName, consentReference]
      properties:
        personId: {type: string}
        displayName: {type: string}
        consentReference: {type: string}
        authorizedScope:
          type: array
          items: {type: string}

    CreateSpeakerEnrollmentRequest:
      type: object
      required: [audioFileId, consentReference]
      properties:
        audioFileId: {type: string}
        consentReference: {type: string}
        language: {type: [string, 'null']}

    RevokeSpeakerProfileRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}

    ConfirmMeetingSpeakerRequest:
      type: object
      required: [personId, speakerProfileId, expectedTranscriptVersion]
      properties:
        personId: {type: string}
        speakerProfileId: {type: string}
        expectedTranscriptVersion: {type: integer, minimum: 0}

    RejectMeetingSpeakerRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string}
        candidatePersonId: {type: [string, 'null']}
        candidateSpeakerProfileId: {type: [string, 'null']}

    SpeakerProfileListResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SpeakerProfile'
            page:
              $ref: '#/components/schemas/PageInfo'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    SpeakerProfile:
      type: object
      required: [speakerProfileId, personId, displayName, status]
      properties:
        speakerProfileId: {type: string}
        personId: {type: string}
        displayName: {type: string}
        status: {type: string}
        enrollmentCount: {type: integer}
        lastEnrolledAt: {type: [string, 'null'], format: date-time}

    MeetingSpeakerListResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [meetingId, speakers]
          properties:
            meetingId: {type: string}
            speakers:
              type: array
              items:
                $ref: '#/components/schemas/MeetingSpeaker'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    MeetingSpeaker:
      type: object
      required: [speakerLabel, confirmationStatus, candidates]
      properties:
        speakerLabel: {type: string}
        displayName: {type: [string, 'null']}
        personId: {type: [string, 'null']}
        speakerProfileId: {type: [string, 'null']}
        confirmationStatus: {type: string}
        candidates:
          type: array
          items:
            type: object
            required: [personId, speakerProfileId, displayName, confidence]
            properties:
              personId: {type: string}
              speakerProfileId: {type: string}
              displayName: {type: string}
              confidence: {type: number, minimum: 0, maximum: 1}

    # ── Minutes ────────────────────────────────────────────────
    RegenerateMinutesRequest:
      type: object
      required: [expectedTranscriptVersion]
      properties:
        expectedTranscriptVersion: {type: integer, minimum: 0}
        expectedMinutesVersion: {type: [integer, 'null'], minimum: 0}

    MinutesResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [meetingId, minutesId, minutesVersion, staleStatus, markdown, sections]
          properties:
            meetingId: {type: string}
            minutesId: {type: string}
            minutesVersion: {type: integer}
            staleStatus: {type: string}
            markdown: {type: string}
            sections:
              type: array
              items:
                type: object
                required: [type, title]
                properties:
                  type: {type: string}
                  title: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [text]
                      properties:
                        text: {type: string}
                        evidence:
                          type: array
                          items:
                            type: object
                            properties:
                              segmentId: {type: string}
                              startMs: {type: integer}
                              endMs: {type: integer}
                              evidenceTextSnapshot: {type: string}
            artifactManifestId: {type: string}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    # ── Items ─────────────────────────────────────────────────
    UpdateActionItemRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string}
        assigneePersonId: {type: [string, 'null']}
        dueAt: {type: [string, 'null'], format: date-time}
        status: {type: string}
        expectedVersion: {type: integer, minimum: 0}

    # ── Documents ─────────────────────────────────────────────
    CreateDocumentRequest:
      type: object
      description: |
        Register an already-uploaded knowledge-base document file for parsing
        and indexing. The file itself must already exist in object storage
        (referenced by `fileId`); phase-1 does not expose an in-app document
        upload flow analogous to audio's multipart upload — the file is
        ingested out-of-band, the API registers its metadata and triggers
        the parse / chunk / embed pipeline.
      required: [title, fileId, documentType, securityLevel]
      properties:
        title: {type: string, minLength: 1}
        fileId: {type: string, minLength: 1, description: 'TOS / MinIO object key for the source file'}
        documentType:
          type: string
          enum: [PDF, DOCX, MARKDOWN, TXT]
        securityLevel:
          $ref: '#/components/schemas/SecurityLevel'
        contentHash:
          type: [string, 'null']
          description: 'SHA-256 of the source file content (optional, recorded for audit / dedup)'

    Document:
      type: object
      description: |
        A registered knowledge-base document. `textExtractionStatus` reflects
        the document-parser pipeline (Apache Tika) state; `status` is the
        business-level lifecycle (ACTIVE / DELETED). RAG retrieval filters
        on both.
      required:
        [documentId, tenantId, title, fileId, documentType, status,
         securityLevel, textExtractionStatus, createdAt, updatedAt]
      properties:
        documentId: {type: string}
        tenantId: {type: string}
        title: {type: string}
        fileId: {type: string}
        documentType:
          type: string
          enum: [PDF, DOCX, MARKDOWN, TXT]
        status:
          type: string
          enum: [ACTIVE, DELETED]
        securityLevel:
          $ref: '#/components/schemas/SecurityLevel'
        textExtractionStatus:
          type: string
          enum: [PENDING, EXTRACTED, FAILED, OCR_UNSUPPORTED, TYPE_UNSUPPORTED]
        contentHash: {type: [string, 'null']}
        sourceUri: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt: {type: [string, 'null'], format: date-time}

    DocumentResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/Document'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    DocumentListResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    # ── RAG ────────────────────────────────────────────────────
    RagQueryRequest:
      type: object
      required: [question, scope]
      properties:
        question: {type: string, minLength: 1}
        scope:
          type: object
          properties:
            meetingIds:
              type: array
              items: {type: string}
            documentIds:
              type: array
              items: {type: string}
        topN: {type: integer, minimum: 1, maximum: 20, default: 8}
        includeStale: {type: boolean, default: false}

    RagAnswerResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/RagAnswerDTO'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    RagAnswerDTO:
      type: object
      required: [answer, citations, coverage, artifactManifestId]
      properties:
        answer: {type: string}
        citations:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/MeetingSegmentCitation'
              - $ref: '#/components/schemas/DocumentChunkCitation'
        coverage:
          $ref: '#/components/schemas/RagAnswerCoverage'
        artifactManifestId: {type: string}

    MeetingSegmentCitation:
      type: object
      required: [type, meetingId, meetingTitle, segmentId, speaker, startMs, endMs, content]
      properties:
        type: {type: string, const: MEETING_SEGMENT}
        meetingId: {type: string}
        meetingTitle: {type: string}
        segmentId: {type: string}
        speaker: {type: string}
        startMs: {type: integer}
        endMs: {type: integer}
        content: {type: string}

    DocumentChunkCitation:
      type: object
      required: [type, documentId, documentTitle, chunkId, page, content]
      properties:
        type: {type: string, const: DOCUMENT_CHUNK}
        documentId: {type: string}
        documentTitle: {type: string}
        chunkId: {type: string}
        page: {type: integer}
        content: {type: string}

    # ── Export ─────────────────────────────────────────────────
    CreateExportRequest:
      type: object
      required: [format, expectedTranscriptVersion]
      properties:
        format:
          type: string
          enum: [MARKDOWN, DOCX, PDF]
        expectedTranscriptVersion: {type: integer, minimum: 0}
        expectedMinutesVersion: {type: [integer, 'null'], minimum: 0}
        includeTranscript: {type: boolean, default: true}
        includeMinutes: {type: boolean, default: true}
        includeItems: {type: boolean, default: true}
        includeSpeakers: {type: boolean, default: true}
        watermarkText:
          type: [string, 'null']
          maxLength: 200
          description: Optional watermark to embed in the rendered file footer.

    ExportJobResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [exportId, meetingId, status, format, createdAt]
          properties:
            exportId: {type: string}
            meetingId: {type: string}
            status:
              type: string
              enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, REVOKED]
            format:
              type: string
              enum: [MARKDOWN, DOCX, PDF]
            dataBoundaryMode:
              type: [string, 'null']
              enum: [FULL, REDACTED, null]
              default: FULL
            inputTranscriptVersion: {type: [integer, 'null'], minimum: 0}
            inputMinutesVersion:    {type: [integer, 'null'], minimum: 0}
            snapshotManifestId:     {type: [string, 'null']}
            watermarkText:          {type: [string, 'null']}
            downloadUrl: {type: [string, 'null']}
            downloadUrlExpiresAt: {type: [string, 'null'], format: date-time}
            sha256: {type: [string, 'null']}
            fileSizeBytes: {type: [integer, 'null'], format: int64, minimum: 0}
            revoked: {type: boolean}
            stale:
              type: boolean
              default: false
              description: >-
                True when the meeting's current transcriptVersion / minutesVersion
                has moved past the snapshot's version. UI surfaces a warning.
            errorCode: {type: [string, 'null']}
            expiresAt: {type: string, format: date-time}
            createdAt: {type: [string, 'null'], format: date-time}
            finishedAt: {type: [string, 'null'], format: date-time}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    # ── Compliance / Admin Requests ───────────────────────────
    CreateLegalHoldRequest:
      type: object
      required: [reason, scopes]
      properties:
        reason: {type: string, minLength: 1}
        expiresAt: {type: [string, 'null'], format: date-time}
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComplianceScope'

    ReleaseLegalHoldRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}

    CreateDeletionJobRequest:
      type: object
      required: [reason, scopes]
      properties:
        reason: {type: string, minLength: 1}
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComplianceScope'

    CreateBreakGlassRequest:
      type: object
      required: [reason, scopes, expiresAt]
      properties:
        reason: {type: string, minLength: 1}
        expiresAt: {type: string, format: date-time}
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComplianceScope'

    ApproveBreakGlassRequest:
      type: object
      properties:
        comment: {type: [string, 'null']}

    RejectBreakGlassRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}

    LegalHoldResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/LegalHold'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    LegalHold:
      type: object
      required: [legalHoldId, tenantId, name, scope, status, createdAt]
      properties:
        legalHoldId: {type: string}
        tenantId: {type: string}
        name: {type: string}
        scope: {type: string}
        status: {type: string}
        reason: {type: [string, 'null']}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        releasedAt: {type: [string, 'null'], format: date-time}

    ComplianceScope:
      type: object
      required: [entityType, entityId]
      properties:
        entityType:
          type: string
          enum: [MEETING, MEETING_FILE, DOCUMENT, EXPORT, ARTIFACT, SPEAKER_PROFILE, AUDIT_EVENT]
        entityId: {type: string}

    # ── Delete Requests ────────────────────────────────────────
    DeleteMeetingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        legalHoldAcknowledged:
          type: boolean
          default: false
        expectedVersion:
          type: integer
          minimum: 0

    DeleteSpeakerProfileRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    # ── Enums (fact source: schemas/common/enums.yaml) ──────────
    SecurityLevel:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, SECRET]

    MeetingStatus:
      type: string
      enum: [CREATED, PROCESSING, SUCCEEDED, FAILED, DELETED]

    ProcessingTaskStatus:
      type: string
      enum: [PENDING, QUEUED, RUNNING, ORPHANED, PARTIAL_SUCCEEDED, SUCCEEDED, FAILED, CANCEL_PENDING, CANCELLED]

    ProcessingTaskPhase:
      type: string
      enum: [WORKER_DAG_RUNNING, WORKER_DAG_DONE, JAVA_LLM_RUNNING, TERMINAL]

    StepStatus:
      type: string
      enum: [PENDING, QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, CANCELLED]

    AudioUploadStatus:
      type: string
      enum: [INITIATED, UPLOADING, COMPLETED, ABORTED, EXPIRED]

    ProcessingStep:
      type: string
      enum: [AUDIO_UPLOAD, AUDIO_PREPROCESS, ASR, ALIGNMENT, DIARIZATION, SPEAKER_EMBEDDING, SPEAKER_MATCHING, TRANSCRIPT_MERGE, SUMMARY, EXTRACTION, RAG_INDEXING, EXPORT]

    ProcessingStepUpdateSource:
      type: string
      enum: [JAVA_TASK_SERVICE, AI_WORKER_CALLBACK]

    RagAnswerCoverage:
      type: string
      enum: [TRANSCRIPT_ONLY, FULL]

    DocumentRole:
      type: string
      enum: [REFERENCE, ATTACHMENT]
      description: REFERENCE = injected into minutes prompt; ATTACHMENT = displayed only.

    AttachMeetingDocumentRequest:
      type: object
      required: [documentId, role]
      properties:
        documentId:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/DocumentRole'

    MeetingDocumentItem:
      type: object
      required: [id, documentId, role, attachedAt]
      properties:
        id:
          type: string
        documentId:
          type: string
        title:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/DocumentRole'
        securityLevel:
          $ref: '#/components/schemas/SecurityLevel'
        attachedBy:
          type: [string, 'null']
        attachedAt:
          type: string
          format: date-time

    MeetingDocumentsResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            $ref: '#/components/schemas/MeetingDocumentItem'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    MeetingDocumentResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/MeetingDocumentItem'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}

    GlossaryTerm:
      type: object
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 64
        definition:
          type: [string, 'null']
          maxLength: 256
        aliases:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 64

    UpdateMeetingGlossaryRequest:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/GlossaryTerm'

    MeetingGlossary:
      type: object
      required: [meetingId, terms, updatedAt]
      properties:
        meetingId:
          type: string
        terms:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryTerm'
        updatedAt:
          type: string
          format: date-time

    MeetingGlossaryResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          $ref: '#/components/schemas/MeetingGlossary'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}
