openapi: 3.1.0
info:
  title: Meeting Public API
  description: Meeting Intelligence Platform Public API
  version: 0.1.0
  contact:
    name: Meeting API Team
    email: api@meeting.dev
servers:
  - url: /api
security:
  - bearerAuth: []

x-api-conventions:
  successEnvelope: '#/components/schemas/ApiResponse'
  idempotency:
    requiredFor: all non-login mutating operations
    conflictStatus: 409

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User management
  - name: Persons
    description: People referenced by speakers and meetings
  - name: Meetings
    description: Meeting resources
  - name: Files
    description: Audio and reference file upload management
  - name: Tasks
    description: Processing task lifecycle
  - name: Transcript
    description: Transcript access and editing
  - name: Speakers
    description: Speaker profiles and matching
  - name: Minutes
    description: AI-generated meeting minutes
  - name: Items
    description: Action items, decisions, and risks
  - name: Documents
    description: Document management and indexing
  - name: RAG
    description: Retrieval-augmented generation queries
  - name: Exports
    description: Meeting export jobs
  - name: Compliance
    description: Legal holds and compliance
  - name: Admin
    description: Administrative operations including deletion jobs and break-glass

paths:
  # ── Auth ────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      description: Authenticate user with credentials and obtain access token.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      operationId: logout
      description: Invalidate current access token and end session.
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentUser
      description: Retrieve the authenticated user profile and permissions.
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Users ──────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      description: List users in the current tenant with pagination.
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          $ref: '#/components/responses/OkPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      description: Create a new user in the current tenant.
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /users/{userId}:
    patch:
      operationId: updateUser
      description: Update an existing user profile and roles.
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ── Meetings ────────────────────────────────────────────────
  /meetings:
    get:
      operationId: listMeetings
      description: List meetings accessible to the authenticated user.
      tags: [Meetings]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Meeting list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createMeeting
      description: Create a new meeting with participants and security level.
      tags: [Meetings]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
      responses:
        '200':
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /meetings/{meetingId}:
    get:
      operationId: getMeeting
      description: Retrieve a single meeting by ID.
      tags: [Meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMeeting
      description: Update meeting metadata, participants, or security level.
      tags: [Meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteMeeting
      description: Soft-delete a meeting with legal-hold acknowledgement.
      tags: [Meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMeetingRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'

  # ── Generic File Uploads ────────────────────────────────────
  /files:
    post:
      operationId: createFileUpload
      description: Initialize a tenant-scoped multipart upload for reference documents. Audio files must use the meeting-scoped audio upload endpoints.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUploadRequest'
      responses:
        '200':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: MIME type not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /files/{uploadId}/parts:
    post:
      operationId: createFileUploadPart
      description: Request a presigned URL for one tenant-scoped file upload part.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUploadPartRequest'
      responses:
        '200':
          description: Signed upload URL for one part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadPartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /files/{uploadId}/complete:
    post:
      operationId: completeFileUpload
      description: Mark all uploaded parts complete and return the durable file ID.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteFileUploadRequest'
      responses:
        '200':
          description: File ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /files/{uploadId}/abort:
    post:
      operationId: abortFileUpload
      description: Discard a partially-uploaded tenant-scoped file upload session.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ── Audio Upload ────────────────────────────────────────────
  /meetings/{meetingId}/files/audio/uploads:
    post:
      operationId: createAudioUpload
      description: |
        Initiate an audio upload session for a meeting. Runs in single-PUT
        mode: the server coerces `partSizeBytes >= fileSizeBytes` so the
        client multipart loop always degenerates to exactly one PUT against
        the session's object key. Files larger than 2 GiB are rejected
        up-front.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudioUploadRequest'
      responses:
        '200':
          description: Audio upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /meetings/{meetingId}/files/audio/uploads/{uploadId}/parts:
    post:
      operationId: createAudioUploadPart
      description: |
        Request a signed PUT URL for an upload part. In single-PUT mode the
        session always has exactly one part (partNumber=1) covering the full
        object; clients should still call this endpoint to obtain the signed
        URL and content-type headers.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudioUploadPartRequest'
      responses:
        '200':
          description: Signed upload URL for one part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadPartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /meetings/{meetingId}/files/audio/uploads/{uploadId}/complete:
    post:
      operationId: completeAudioUpload
      description: |
        Finalize an audio upload after the single PUT has transferred. The
        request `parts` array must contain exactly one entry (partNumber=1)
        matching the session's coerced single-part layout; server-side size
        is compared against the upload session's `fileSizeBytes`.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAudioUploadRequest'
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /meetings/{meetingId}/files/audio/uploads/{uploadId}/abort:
    post:
      operationId: abortAudioUpload
      description: Abort an in-progress single-PUT audio upload session.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meetings/{meetingId}/files/audio/uploads/{uploadId}:
    get:
      operationId: getAudioUpload
      description: Check the status of an audio upload session.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Audio upload session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Processing Tasks ────────────────────────────────────────
  /meetings/{meetingId}/processing-tasks:
    post:
      operationId: createProcessingTask
      description: Start a processing pipeline for a meeting audio file.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessingTaskRequest'
      responses:
        '200':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meetings/{meetingId}/processing-tasks/latest:
    get:
      operationId: getLatestMeetingTask
      description: Retrieve the latest processing task for a meeting.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Latest task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /processing-tasks/{taskId}:
    get:
      operationId: getProcessingTask
      description: Retrieve a processing task by ID.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /processing-tasks/{taskId}/events:
    get:
      operationId: streamProcessingTaskEvents
      description: Subscribe to SSE events for a processing task.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE task events. Each event data matches TaskEvent.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TaskEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

  /processing-tasks/{taskId}/retry:
    post:
      operationId: retryProcessingTask
      description: Retry a failed or orphaned processing task.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /processing-tasks/{taskId}/cancel:
    post:
      operationId: cancelProcessingTask
      description: Request cancellation of a running processing task.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /processing-tasks/{taskId}:resume-java-phase:
    post:
      operationId: resumeProcessingTaskJavaPhase
      description: >
        Promote a task halted at WORKER_DAG_DONE to JAVA_LLM_RUNNING (SUMMARY/EXTRACTION).
        Used when the task was created with holdAtWorkerPhase=true and the user has
        confirmed transcript / speakers in the workstation UI.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Task resumed; response carries phase=JAVA_LLM_RUNNING.
          content:
            application/json:
              schema:
