openapi: 3.1.0
info:
  title: AI Worker Internal API
  description: Internal API for synchronous AI inference calls from meeting-api, protected by HMAC authentication.
  version: 0.1.0
  contact:
    name: Meeting API Team
    email: api@meeting.dev
servers:
  - url: /internal
x-internal-conventions:
  signingString: |
    X-Timestamp + "\n" +
    X-Nonce + "\n" +
    HTTP_METHOD + "\n" +
    URL_PATH_WITH_QUERY + "\n" +
    SHA256(request_body).hex
  signatureHeader: hmac-sha256=<hex>
  timestampSkewSeconds: 300
tags:
  - name: Internal
    description: Synchronous internal inference endpoints called by meeting-api

paths:
  /rerank:
    post:
      operationId: rerankCandidates
      tags: [Internal]
      summary: Rerank authorized RAG candidates.
      description: >
        Synchronous internal endpoint called only by meeting-api. The caller
        must pre-filter candidates by tenant, permission, status, and
        staleStatus; ai-worker only performs model inference and ranking.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Rerank result wrapped in ApiResponse envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthFailed'
        '503':
          $ref: '#/components/responses/RerankUnavailable'
  /models:
    get:
      operationId: listModels
      tags: [Internal]
      summary: List model runtimes and their readiness.
      description: >
        Returns the current state of all configured model runtimes (bge-m3,
        bge-reranker-v2-m3). meeting-api may poll this on startup before
        warmup, and after warmup to confirm READY state. No model load is
        triggered by this call.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: List of model runtimes wrapped in ApiResponse envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/AuthFailed'
  /models/warmup:
    post:
      operationId: warmupModels
      tags: [Internal]
      summary: Trigger lazy-load of configured model runtimes.
      description: >
        Fire-and-forget warmup. meeting-api SHOULD call this once on boot
        (ApplicationReadyEvent) to avoid the first /rerank or /embed
        request paying the 5-15s cold-start cost. The endpoint returns
        immediately with the runtimes' current state (LOADING for runtimes
        whose ensure_loaded() was just scheduled). In fake mode runtimes
        are already READY; the response simply confirms that.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Warmup scheduled; current model states returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/AuthFailed'
  /embed:
    post:
      operationId: embedTexts
      tags: [Internal]
      summary: Embed one or more texts via the bge-m3 dense encoder.
      description: >
        Synchronous internal endpoint used by meeting-api for query-time
        embedding during /api/rag/query (bulk corpus embedding goes
        through the asynchronous TEXT_EMBEDDING task message instead).
        Returns one 1024-dimensional dense vector per input text in
        request order. Empty `texts` is a contract error (400).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Embedding vectors wrapped in ApiResponse envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthFailed'
        '503':
          $ref: '#/components/responses/EmbeddingUnavailable'
  /speakers/reference-embeddings:
    post:
      operationId: getSpeakerReferenceEmbeddings
      tags: [Internal]
      summary: Resolve current speaker reference embeddings by person id.
      description: >
        Synchronous internal endpoint called only by ai-worker during the
        SPEAKER_MATCHING step. Returns the L2-normalized centroid of each
        person's active speaker enrollments (decrypted from KMS envelope on
        demand). Plaintext vectors travel over internal-TLS + HMAC only and
        MUST NOT be logged or persisted by either side. Missing or revoked
        person ids are omitted from `items` — the worker decides whether to
        downgrade SPEAKER_MATCHING or fail.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakerReferenceEmbeddingRequest'
      responses:
        '200':
          description: Reference embeddings wrapped in ApiResponse envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthFailed'
        '503':
          $ref: '#/components/responses/SpeakerReferenceUnavailable'
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
    TraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema:
        type: string
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    Nonce:
      name: X-Nonce
      in: header
      required: true
      schema:
        type: string
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: '^hmac-sha256=[0-9a-f]{64}$'
  schemas:
    SourceType:
      type: string
      enum:
        - PRIMARY_TRANSCRIPT
        - AI_SUMMARY
        - MINUTES
        - DECISION
        - ACTION_ITEM
        - RISK
        - DOCUMENT
    RerankRequest:
      type: object
      required:
        - tenantId
        - query
        - candidates
        - topN
        - modelVersion
      properties:
        tenantId:
          type: string
        query:
          type: string
          minLength: 1
        topN:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        modelVersion:
          type: string
        candidates:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RerankCandidate'
    RerankCandidate:
      type: object
      required:
        - chunkId
        - sourceType
        - text
        - rrfScore
      properties:
        chunkId:
          type: string
        sourceType:
          $ref: '#/components/schemas/SourceType'
        text:
          type: string
          minLength: 1
        rrfScore:
          type: number
          minimum: 0
        sourceVersion:
          type: integer
          minimum: 1
        citationHint:
          type: object
          additionalProperties: true
    RerankResponse:
      type: object
      required:
        - modelVersion
        - items
      properties:
        modelVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RerankResultItem'
    RerankResultItem:
      type: object
      required:
        - chunkId
        - rank
        - rerankScore
      properties:
        chunkId:
          type: string
        rank:
          type: integer
          minimum: 1
        rerankScore:
          type: number
          minimum: 0
          maximum: 1
    ModelStatus:
      type: string
      enum: [NOT_LOADED, LOADING, READY, ERROR]
    ModelInfo:
      type: object
      required: [name, version, status, device, useFake]
      properties:
        name:
          type: string
          description: Logical model name, e.g. "bge-m3" or "bge-reranker-v2-m3".
        version:
          type: string
          description: Runtime-reported model version (real or fake suffix).
        status:
          $ref: '#/components/schemas/ModelStatus'
        device:
          type: string
          description: '"cpu" | "cuda" | "mps" | "fake".'
        useFake:
          type: boolean
        checksum:
          type: [string, 'null']
          description: SHA256 of the weight file when loaded from a local path; null in fake mode.
        modelsDir:
          type: [string, 'null']
          description: Local snapshot directory used in real mode; null when falling back to HF Hub.
        lastError:
          type: [string, 'null']
    ListModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
    WarmupResponse:
      type: object
      required: [triggered, models]
      properties:
        triggered:
          type: boolean
          description: True when at least one runtime transitioned NOT_LOADED → LOADING.
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
    EmbedRequest:
      type: object
      required: [tenantId, texts, modelVersion]
      properties:
        tenantId:
          type: string
        texts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
        modelVersion:
          type: string
          description: Caller-advertised model version; the response echoes the runtime's actual version.
    EmbedResponse:
      type: object
      required: [modelVersion, dimension, vectors]
      properties:
        modelVersion:
          type: string
        dimension:
          type: integer
          minimum: 1
          description: Length of each vector (bge-m3 → 1024).
        vectors:
          type: array
          items:
            type: array
            items:
              type: number
    SpeakerReferenceEmbeddingRequest:
      type: object
      required: [tenantId, personIds]
      properties:
        tenantId:
          type: string
        personIds:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
        asOf:
          type: string
          format: date-time
          description: Optional point-in-time anchor; defaults to server clock.
    SpeakerReferenceEmbeddingItem:
      type: object
      required: [personId, speakerProfileId, values, dim, hash, computedAt]
      properties:
        personId:
          type: string
        speakerProfileId:
          type: string
          description: Active Java speaker profile id authorized for this person.
        values:
          type: array
          items:
            type: number
          description: L2-normalized centroid of active enrollments. Plaintext — do not log.
        dim:
          type: integer
          minimum: 1
        hash:
          type: string
          description: SHA256 of the source enrollment ids the centroid was built from.
        computedAt:
          type: string
          format: date-time
    SpeakerReferenceEmbeddingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerReferenceEmbeddingItem'
    ApiResponse:
      type: object
      required: [success, data, error, requestId, traceId]
      properties:
        success: {type: boolean}
        data:
          anyOf:
            - $ref: '#/components/schemas/RerankResponse'
            - $ref: '#/components/schemas/ListModelsResponse'
            - $ref: '#/components/schemas/WarmupResponse'
            - $ref: '#/components/schemas/EmbedResponse'
            - $ref: '#/components/schemas/SpeakerReferenceEmbeddingResponse'
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        requestId: {type: string}
        traceId: {type: string}
    ErrorInfo:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request. meeting-api must treat this as RERANK_CONTRACT_ERROR and must not silently downgrade.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    AuthFailed:
      description: HMAC authentication failed. meeting-api must treat this as RERANK_CONTRACT_ERROR and must not silently downgrade.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    RerankUnavailable:
      description: Rerank model or runtime unavailable. meeting-api may downgrade to RRF and record RERANK_UNAVAILABLE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    EmbeddingUnavailable:
      description: Embedding model or runtime unavailable. meeting-api MUST NOT silently downgrade — RAG query embedding has no equivalent fallback — and should record EMBEDDING_UNAVAILABLE for the user-facing 503.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    SpeakerReferenceUnavailable:
      description: Speaker reference resolution failed (KMS / DB / signal-quality). ai-worker may degrade SPEAKER_MATCHING or fail-fast.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
