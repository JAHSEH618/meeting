version: 0.1.0

# ── 会议生命周期状态 ──────────────────────────────────────────
# 事实来源。Java MeetingStatus、DDL CHECK 约束、前端展示均以此为准。
# 一期不含 ARCHIVED / READY / DRAFT——从 simple lifecycle 起步。
meetingStatus:
  - CREATED
  - PROCESSING
  - SUCCEEDED
  - FAILED
  - DELETED

securityLevel:
  - PUBLIC
  - INTERNAL
  - CONFIDENTIAL
  - SECRET

processingTaskStatus:
  - PENDING
  - QUEUED
  - RUNNING
  - ORPHANED
  - PARTIAL_SUCCEEDED
  - SUCCEEDED
  - FAILED
  - CANCEL_PENDING
  - CANCELLED

processingTaskPhase:
  - WORKER_DAG_RUNNING
  - WORKER_DAG_DONE
  - JAVA_LLM_RUNNING
  - TERMINAL

stepStatus:
  - PENDING
  - QUEUED
  - RUNNING
  - SUCCEEDED
  - FAILED
  - SKIPPED
  - CANCELLED

audioUploadStatus:
  - INITIATED
  - UPLOADING
  - COMPLETED
  - ABORTED
  - EXPIRED

processingStep:
  - AUDIO_UPLOAD
  - AUDIO_PREPROCESS
  - ASR
  - ALIGNMENT
  - DIARIZATION
  - SPEAKER_EMBEDDING
  - SPEAKER_MATCHING
  - TRANSCRIPT_MERGE
  - SUMMARY
  - EXTRACTION
  - RAG_INDEXING
  - EXPORT

staleStatus:
  - ACTIVE
  - STALE
  - REBUILD_QUEUED
  - REBUILDING
  - VALIDATING
  - FAILED
  - DELETED

knowledgeChunkStatus:
  - ACTIVE
  - DELETED

exportFormat:
  - MARKDOWN
  - DOCX
  - PDF

exportStatus:
  # QUEUED  = created, waiting for consumer
  # RUNNING = consumer is rendering
  # SUCCEEDED = file_id ready, downloadUrl usable
  # FAILED  = render failed, errorCode set
  # CANCELLED = user cancelled
  # REVOKED = SUCCEEDED then download link revoked
  - QUEUED
  - RUNNING
  - SUCCEEDED
  - FAILED
  - CANCELLED
  - REVOKED

exportDataBoundaryMode:
  # FULL = phase 1 default; no text redaction
  # REDACTED = reserved for phase 2+
  - FULL
  - REDACTED

exportType:
  # MEETING = single-meeting export (phase 1)
  # AUDIT   = compliance audit export (phase 7 reserve)
  - MEETING
  - AUDIT

# ── Phase 7 合规 ─────────────────────────────────────────────────
# legal_holds.status — 一期单向流转：ACTIVE → RELEASED；释放后需新建。
legalHoldStatus:
  - ACTIVE
  - RELEASED

legalHoldScopeType:
  - MEETING
  - DOCUMENT
  - SPEAKER_PROFILE
  - PROJECT

# deletion_jobs.status — REQUESTED → RUNNING → SUCCEEDED | PARTIAL_FAILED
# | FAILED | BLOCKED_BY_LEGAL_HOLD；PENDING_APPROVAL 一期保留不启用。
deletionJobStatus:
  - REQUESTED
  - PENDING_APPROVAL
  - RUNNING
  - SUCCEEDED
  - PARTIAL_FAILED
  - FAILED
  - BLOCKED_BY_LEGAL_HOLD

deletionScopeType:
  - MEETING
  - DOCUMENT
  - SPEAKER_PROFILE
  - USER
  - PROJECT
  - TENANT

# break_glass_requests.status — PENDING → APPROVED|REJECTED；APPROVED
# 可后续转 EXPIRED（窗口结束）或 REVOKED（提前撤回）。
breakGlassStatus:
  - PENDING
  - APPROVED
  - REJECTED
  - EXPIRED
  - REVOKED

# audit_events.actor_type
auditActorType:
  - USER
  - SYSTEM
  - SERVICE_ACCOUNT

# audit_events.result — 业务级 result，区分 SUCCESS vs 系统 FAILURE vs
# 权限 BLOCKED vs 显式 DENIED（例如 break-glass 自审批拒绝）。
auditResult:
  - SUCCESS
  - FAILURE
  - BLOCKED
  - DENIED

# audit_events.action — 一期覆盖 phase 6 / 7 写入路径
auditAction:
  - CREATE
  - READ
  - UPDATE
  - DELETE
  - EXPORT
  - LOGIN
  - LOGOUT
  - LEGAL_HOLD_PLACE
  - LEGAL_HOLD_RELEASE
  - DELETION_REQUEST
  - DELETION_EXECUTE
  - BREAK_GLASS_REQUEST
  - BREAK_GLASS_APPROVE
  - BREAK_GLASS_REJECT
  - BREAK_GLASS_ACCESS

timestampPrecision:
  - WORD
  - SEGMENT
  - APPROXIMATE

citationType:
  - MEETING_SEGMENT
  - DOCUMENT_CHUNK

ragAnswerCoverage:
  - TRANSCRIPT_ONLY
  - FULL

processingStepUpdateSource:
  - JAVA_TASK_SERVICE
  - AI_WORKER_CALLBACK

taskEventType:
  - TASK_SNAPSHOT
  - TASK_STARTED
  - TASK_STEP_UPDATED
  - TASK_HEARTBEAT
  - TRANSCRIPT_READY
  - TASK_FAILED
  - TASK_COMPLETED
  - TASK_CANCELLED

sourceType:
  - PRIMARY_TRANSCRIPT
  - AI_SUMMARY
  - DECISION
  - ACTION_ITEM
  - RISK
  - DOCUMENT

# ── Phase 3 业务对象状态 ──────────────────────────────────────────
# AI 抽取产物的"用户确认"独立通道。DRAFT = AI 建议未确认；ACCEPTED / REJECTED
# = 用户已表态；NEEDS_REVIEW = AI 标记需复核但用户未表态。重新生成不得覆盖已表态项。
acceptanceStatus:
  - DRAFT
  - ACCEPTED
  - REJECTED
  - NEEDS_REVIEW

# meeting_minutes.status — 业务可见性
minutesStatus:
  - DRAFT
  - PUBLISHED
  - REVISED

# meeting_action_items.status — 业务推进状态
actionItemStatus:
  - OPEN
  - IN_PROGRESS
  - COMPLETED
  - CANCELLED
  - BLOCKED

# meeting_decisions.status
decisionStatus:
  - PROPOSED
  - APPROVED
  - IMPLEMENTED
  - REJECTED

# meeting_risks.severity
riskSeverity:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

# meeting_risks.status
riskStatus:
  - OPEN
  - MITIGATED
  - CLOSED
  - ESCALATED

# ── Phase 4 声纹状态 ─────────────────────────────────────────────
# speaker_profiles.consent_status — 撤销级联在 ACTIVE -> REVOKED -> DELETED
# 之间单向流转；DELETED 不可恢复。
speakerProfileConsentStatus:
  - ACTIVE
  - REVOKED
  - DELETED

# speaker_enrollments.enrollment_status — worker 回写驱动 PENDING -> SUCCEEDED|FAILED
speakerEnrollmentStatus:
  - PENDING
  - SUCCEEDED
  - FAILED

# meeting_speakers.verification_status — 每个匿名 speaker label 的人工确认状态
meetingSpeakerVerificationStatus:
  - CANDIDATE
  - CONFIRMED
  - REJECTED
  - MANUAL

# transcript_segments.edit_status — 区分原始 ASR 输出与用户编辑后的版本
transcriptSegmentEditStatus:
  - ORIGINAL
  - EDITED

# transcript_segments.speaker_match_status — 该 segment 是否已落人工确认结果
transcriptSegmentSpeakerMatchStatus:
  - UNMATCHED
  - CANDIDATE
  - CONFIRMED
  - REJECTED

