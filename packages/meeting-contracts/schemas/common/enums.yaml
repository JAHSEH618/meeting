version: 0.1.0

# ── 会议生命周期状态 ──────────────────────────────────────────
# 事实来源。Java MeetingStatus、DDL CHECK 约束、前端展示均以此为准。
# 一期不含 ARCHIVED / READY / DRAFT——从 simple lifecycle 起步。
meetingStatus:
  - CREATED
  - PROCESSING
  - SUCCEEDED
  - FAILED
  - DELETED

securityLevel:
  - PUBLIC
  - INTERNAL
  - CONFIDENTIAL
  - SECRET

taskStatus:
  - PENDING
  - QUEUED
  - RUNNING
  - ORPHANED
  - PARTIAL_SUCCEEDED
  - SUCCEEDED
  - FAILED
  - CANCEL_PENDING
  - CANCELLED

stepStatus:
  - PENDING
  - QUEUED
  - RUNNING
  - SUCCEEDED
  - FAILED
  - SKIPPED
  - CANCELLED

processingStep:
  - AUDIO_UPLOAD
  - AUDIO_PREPROCESS
  - ASR
  - ALIGNMENT
  - DIARIZATION
  - SPEAKER_EMBEDDING
  - SPEAKER_MATCHING
  - TRANSCRIPT_MERGE
  - SUMMARY
  - EXTRACTION
  - RAG_INDEXING
  - EXPORT

staleStatus:
  - ACTIVE
  - STALE
  - REBUILD_QUEUED
  - REBUILDING
  - VALIDATING
  - FAILED
  - DELETED

knowledgeChunkStatus:
  - ACTIVE
  - DELETED

exportFormat:
  - MARKDOWN
  - DOCX
  - PDF

timestampPrecision:
  - WORD
  - SEGMENT
  - APPROXIMATE

citationType:
  - MEETING_SEGMENT
  - DOCUMENT_CHUNK

taskEventType:
  - TASK_SNAPSHOT
  - TASK_STARTED
  - TASK_STEP_UPDATED
  - TASK_HEARTBEAT
  - TRANSCRIPT_READY
  - TASK_FAILED
  - TASK_COMPLETED
  - TASK_CANCELLED

sourceType:
  - PRIMARY_TRANSCRIPT
  - AI_SUMMARY
  - DECISION
  - ACTION_ITEM
  - RISK
  - DOCUMENT
