    opsTags: [speaker, embedding]
  - code: SPEAKER_MATCH_FAILED
    step: SPEAKER_MATCHING
    retryable: true
    userMessage: 声纹匹配失败
    i18nKey: errors.SPEAKER_MATCH_FAILED
    opsTags: [speaker, matching]
  - code: TRANSCRIPT_MERGE_FAILED
    step: TRANSCRIPT_MERGE
    retryable: true
    userMessage: 转录合并失败
    i18nKey: errors.TRANSCRIPT_MERGE_FAILED
    opsTags: [transcript]

  # ── Callback ──────────────────────────────────────────────────
  - code: CALLBACK_AUTH_FAILED
    step: CALLBACK
    retryable: false
    userMessage: Worker 回调鉴权失败
