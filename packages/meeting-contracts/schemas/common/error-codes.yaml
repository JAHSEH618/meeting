  - code: ASR_MODEL_TIMEOUT
    step: ASR
    retryable: true
    userMessage: ASR 模型推理超时
    i18nKey: errors.ASR_MODEL_TIMEOUT
    opsTags: [asr, timeout]
  - code: ASR_GPU_OOM
    step: ASR
    retryable: true
    userMessage: ASR GPU 显存不足
    i18nKey: errors.ASR_GPU_OOM
    opsTags: [asr, gpu, oom]
  - code: DIARIZATION_FAILED
    step: DIARIZATION
    retryable: true
