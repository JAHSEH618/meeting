  - code: SECURITY_LEVEL_BLOCKED
    step: LLM
    retryable: false
    userMessage: 一期不支持该安全等级的自动 LLM 处理
    i18nKey: errors.SECURITY_LEVEL_BLOCKED
    opsTags: [llm, security]
  - code: LLM_DATA_BOUNDARY_BLOCKED
    step: LLM
    retryable: false
