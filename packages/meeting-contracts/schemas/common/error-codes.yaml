version: 0.1.0

errorCodes:
  # ── Auth ──────────────────────────────────────────────────────
  - code: AUTH_REQUIRED
    step: AUTH
    retryable: false
    userMessage: 请先登录
    i18nKey: errors.AUTH_REQUIRED
    opsTags: [auth]
  - code: PERMISSION_DENIED
    step: AUTH
    retryable: false
    userMessage: 没有执行该操作的权限
    i18nKey: errors.PERMISSION_DENIED
    opsTags: [auth, permission]
  - code: TENANT_CONTEXT_MISSING
    step: AUTH
    retryable: false
    userMessage: 租户上下文缺失
    i18nKey: errors.TENANT_CONTEXT_MISSING
    opsTags: [tenant, rls]

  # ── Validation ────────────────────────────────────────────────
  - code: VALIDATION_FAILED
    step: VALIDATION
    retryable: false
    userMessage: 请求参数不符合要求
    i18nKey: errors.VALIDATION_FAILED
    opsTags: [validation]
  - code: VERSION_CONFLICT
    step: VALIDATION
    retryable: false
    userMessage: 内容已被更新，请刷新后重试
    i18nKey: errors.VERSION_CONFLICT
    opsTags: [version, conflict]
  - code: IDEMPOTENCY_CONFLICT
    step: VALIDATION
    retryable: false
    userMessage: 幂等键已被不同请求使用
    i18nKey: errors.IDEMPOTENCY_CONFLICT
    opsTags: [idempotency, conflict]

  # ── Task ──────────────────────────────────────────────────────
  - code: TASK_NOT_FOUND
    step: TASK
    retryable: false
    userMessage: 任务不存在
    i18nKey: errors.TASK_NOT_FOUND
    opsTags: [task]
  - code: MEETING_NOT_FOUND
    step: TASK
    retryable: false
    userMessage: 会议不存在
    i18nKey: errors.MEETING_NOT_FOUND
    opsTags: [meeting]
  - code: TASK_ATTEMPT_CONFLICT
    step: TASK
    retryable: false
    userMessage: 任务尝试次数已变化
    i18nKey: errors.TASK_ATTEMPT_CONFLICT
    opsTags: [task, attempt, conflict]
  - code: TASK_LEASE_CONFLICT
    step: TASK
    retryable: false
    userMessage: 任务租约已变化
    i18nKey: errors.TASK_LEASE_CONFLICT
    opsTags: [task, lease, conflict]
  - code: WORKER_LEASE_EXPIRED
    step: TASK
    retryable: true
    userMessage: Worker 租约已过期
    i18nKey: errors.WORKER_LEASE_EXPIRED
    opsTags: [task, lease]
  - code: INVALID_TASK_MESSAGE
    step: TASK
    retryable: false
    userMessage: 任务消息不符合处理要求
    i18nKey: errors.INVALID_TASK_MESSAGE
    opsTags: [task, schema, worker]

  # ── Storage / OSS ─────────────────────────────────────────────
  - code: OSS_OBJECT_NOT_FOUND
    step: STORAGE
    retryable: false
    userMessage: 存储对象不存在
    i18nKey: errors.OSS_OBJECT_NOT_FOUND
    opsTags: [oss, storage]
  - code: OSS_READ_FAILED
    step: STORAGE
    retryable: true
    userMessage: 存储读取失败
    i18nKey: errors.OSS_READ_FAILED
    opsTags: [oss, storage, io]
  - code: OSS_WRITE_FAILED
    step: STORAGE
    retryable: true
    userMessage: 存储写入失败
    i18nKey: errors.OSS_WRITE_FAILED
    opsTags: [oss, storage, io]
  - code: UPLOAD_SESSION_EXPIRED
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 上传会话已过期
    i18nKey: errors.UPLOAD_SESSION_EXPIRED
    opsTags: [upload, storage]
  - code: UPLOAD_ALREADY_ABORTED
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 上传会话已取消
    i18nKey: errors.UPLOAD_ALREADY_ABORTED
    opsTags: [upload, state]
  - code: UPLOAD_ALREADY_COMPLETED
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 上传已完成
    i18nKey: errors.UPLOAD_ALREADY_COMPLETED
    opsTags: [upload, state]
  - code: UPLOAD_PART_HASH_MISMATCH
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 分片校验失败
    i18nKey: errors.UPLOAD_PART_HASH_MISMATCH
    opsTags: [upload, checksum]
  - code: UPLOAD_FILE_HASH_MISMATCH
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 文件校验失败
    i18nKey: errors.UPLOAD_FILE_HASH_MISMATCH
    opsTags: [upload, checksum]
  - code: UPLOAD_FILE_SIZE_MISMATCH
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 文件大小不一致
    i18nKey: errors.UPLOAD_FILE_SIZE_MISMATCH
    opsTags: [upload, size]
  - code: UPLOAD_TOO_MANY_PARTS
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 上传分片数量超过上限
    i18nKey: errors.UPLOAD_TOO_MANY_PARTS
    opsTags: [upload, validation]
  - code: UPLOAD_INCOMPLETE_PARTS
    step: AUDIO_UPLOAD
    retryable: false
    userMessage: 上传分片不完整
    i18nKey: errors.UPLOAD_INCOMPLETE_PARTS
    opsTags: [upload, validation]

  # ── Audio Pipeline ────────────────────────────────────────────
